# Workspace-wide `clippy::disallowed_methods` entries — see CLAUDE.md's
# "Display columns" section, and `hume-editor/src/editor/lints/test_globals.rs`'s
# "Test-suite process-global hygiene" module doc, for the rules these enforce
# and why the constant reachable from most crates (`unicode-width`'s methods)
# or with essentially zero legitimate exceptions workspace-wide
# (`std::env::set_var`/`remove_var`) is a better fit for this than a
# hand-rolled scanner. A file with a real exception carries its own
# `#[allow(clippy::disallowed_methods)]` — grep the tree for the attribute to
# find every one.
disallowed-methods = [
    # Display-column math goes through `hume_rope::width`
    # (`tab_advance`/`grapheme_width`/`str_width`), never a direct
    # `unicode-width` call — `hume-rope/src/width.rs` itself is the sanctioned
    # exception. `hume-editor`'s chrome-test oracles (an independent
    # width assertion against the code under test) are the other exception.
    "unicode_width::UnicodeWidthStr::width",
    "unicode_width::UnicodeWidthStr::width_cjk",
    "unicode_width::UnicodeWidthChar::width",
    "unicode_width::UnicodeWidthChar::width_cjk",
    # HUME_RUNTIME/TMPDIR/XDG_*/HOME/PATH are process-global env vars a
    # parallel test run shares — mutating one outside a `TEST_GLOBALS`-holding
    # guard races every other test reading or writing the same var
    # concurrently. The nine files under `hume-editor/src/editor/tests/` that
    # own a guard struct (or a loader helper documented to require a
    # caller-held `TEST_GLOBALS` claim) are the sanctioned exception.
    "std::env::set_var",
    "std::env::remove_var",
    # Line counts and ranges go through `hume-rope`'s domain-typed
    # `RopeyLine`/`ContentLine`/`RopeyLineCount`/`ContentLineCount`
    # (`hume-rope/src/line.rs`) — see CLAUDE.md's "Line counts and ranges".
    # Those types can't stop a raw `Rope::len_lines()`/`line_to_char()`/
    # `char_to_line()` call from reaching a bare `usize`, so the ban lives
    # here instead; `hume-rope/src/lines.rs` carries a file-level
    # `#[allow(clippy::disallowed_methods)]` for its own sanctioned wrappers
    # (`ropey_line_count`, `line_start_char`, `char_to_ropey_line`, and every
    # other function in that file resolving a line's start the same way) —
    # its child module `hume-rope/src/lines/tests.rs` inherits the same
    # allow for its own independent oracle (pinning ropey's own methods, not
    # our wrappers), needing no `#[allow]` of its own.
    "ropey::Rope::len_lines",
    "ropey::RopeSlice::len_lines",
    "ropey::Rope::line_to_char",
    "ropey::Rope::char_to_line",
]
