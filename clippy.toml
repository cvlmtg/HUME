# `clippy::unwrap_used` is denied in CI and scripts/test-all.sh. Test code is
# exempt: `#[test]` fns and `#[cfg(test)]` modules may `.unwrap()`.
allow-unwrap-in-tests = true

# Workspace-wide `clippy::disallowed_methods` entries, three groups: a
# constant reachable from most crates (`unicode-width`'s methods — CLAUDE.md's
# "Display columns" section), a set with essentially zero legitimate
# exceptions workspace-wide (`std::env::set_var`/`remove_var`), and a crate's
# own escape hatch around its own domain
# types (raw `ropey` line-index methods — CLAUDE.md's "Line counts and
# ranges" section). All three are a better fit for a compiler-checked ban
# than a hand-rolled scanner. A file with a real exception carries its own
# `#[allow(clippy::disallowed_methods)]` — grep the tree for the attribute to
# find every one.
disallowed-methods = [
    # Display-column math goes through `hume_rope::width`
    # (`tab_advance`/`grapheme_width`/`str_width`), never a direct
    # `unicode-width` call — `hume-rope/src/width.rs` itself is the sanctioned
    # exception. A handful of chrome-test oracles in `hume-ui` and
    # `hume-editor` (an independent width assertion against the code under
    # test) are the other exception.
    "unicode_width::UnicodeWidthStr::width",
    "unicode_width::UnicodeWidthStr::width_cjk",
    "unicode_width::UnicodeWidthChar::width",
    "unicode_width::UnicodeWidthChar::width_cjk",
    # Every thread of a parallel test run shares the process environment, and
    # every spawn reads it, so nothing sets an env var: a session's `PATH` is
    # `Dirs::search_path` (`hume-platform/src/dirs.rs`).
    "std::env::set_var",
    "std::env::remove_var",
    # Line counts and ranges go through `hume-rope`'s domain-typed
    # `RopeyLine`/`ContentLine`/`RopeyLineCount`/`ContentLineCount`
    # (`hume-rope/src/line.rs`) — see CLAUDE.md's "Line counts and ranges".
    # Those types can't stop a raw `Rope`/`RopeSlice` `len_lines()`/
    # `line_to_char()`/`char_to_line()` call from reaching a bare `usize`, so
    # the ban lives here instead; `hume-rope/src/lines.rs` carries a
    # file-level `#[allow(clippy::disallowed_methods)]` for its own sanctioned
    # wrappers (`ropey_line_count`, `line_start_char`, `slice_line_start_char`,
    # `char_to_ropey_line`, and every other function in that file resolving a
    # line's start the same way) — its child module `hume-rope/src/lines/tests.rs`
    # inherits the same allow for its own independent oracle (pinning ropey's
    # own methods, not our wrappers), needing no `#[allow]` of its own.
    # `hume-rope/src/grapheme.rs`'s line-relative column resolvers route
    # through `slice_line_start_char` rather than calling `RopeSlice::line_to_char`
    # directly, so that file carries no `#[allow]` of its own either.
    "ropey::Rope::len_lines",
    "ropey::RopeSlice::len_lines",
    "ropey::Rope::line_to_char",
    "ropey::Rope::char_to_line",
    "ropey::RopeSlice::line_to_char",
    "ropey::RopeSlice::char_to_line",
    # A layout's chrome rows come from the editor's models (the tab bar's
    # visibility, the drawer, a docked popup), which the engine cannot see.
    # `EditorState::screen_layout` (`hume-editor/src/editor/geometry.rs`) is the
    # one caller that computes them; the engine's own layout tests are the
    # other exception.
    "hume_engine::pipeline::EngineView::screen_layout",
    # The editor acts through a builtin's shown or focused pane only after it
    # checks that the pane still shows its buffer (and is focused).
    # `CommandPane::checked`/`FocusedPane::checked`
    # (`hume-editor/src/editor/commands/target.rs`) run that check and are the
    # only readers of the raw pane.
    "hume_scripting::host::ShownHandle::handle",
    "hume_scripting::host::FocusedHandle::handle",
]
