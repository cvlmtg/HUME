[package]
name = "hume-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
hume-platform = { path = "../hume-platform" }
ropey.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
ratatui.workspace = true
# Unused directly: ratatui's layout-cache feature needs critical-section's std
# backend registered (no_std by default, otherwise a link error on Windows).
critical-section.workspace = true
bitflags = "2"
slotmap = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tempfile = "3"
ropey.workspace = true
