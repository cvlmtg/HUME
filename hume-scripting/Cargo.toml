[package]
name = "hume-scripting"
version.workspace = true
edition = "2024"

[features]
# Expose set_data_dir for editor integration tests.
test-util = []

[dependencies]
hume-editing = { path = "../hume-editing" }
hume-engine = { path = "../hume-engine" }
hume-lsp = { path = "../hume-lsp" }
hume-ops = { path = "../hume-ops" }
hume-platform = { path = "../hume-platform" }
hume-rope = { path = "../hume-rope" }
hume-treesitter = { path = "../hume-treesitter" }
# unsandboxed-kernel: macro expansion runs on a copy of the kernel image
# Engine::new already builds, instead of building a sandboxed second one.
# Plugins are full-trust, so the sandbox restricts nothing they can't do.
steel-core = { version = "0.8.3", features = ["custom-hash", "unsandboxed-kernel"] }
termina = "0.4.0"
slotmap = "1"
serde_json.workspace = true
num-traits.workspace = true
rustc-hash.workspace = true
which = "8.0.6"

[dev-dependencies]
hume-editing = { path = "../hume-editing", features = ["test-util"] }
hume-platform = { path = "../hume-platform", features = ["test-util"] }
insta = "1.47"
tempfile = "3"

