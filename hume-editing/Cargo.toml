[package]
name = "hume-editing"
version = "0.1.0"
edition = "2024"

[features]
# The marker-notation parser (`marked`) and unnormalized-set constructors for
# other crates' tests. test-fixtures turns it on.
test-util = []

[dependencies]
ropey.workspace = true
unicode-segmentation.workspace = true
similar.workspace = true
rustc-hash.workspace = true
hume-rope = { path = "../hume-rope" }

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.11.0"
test-fixtures = { path = "../test-fixtures" }
