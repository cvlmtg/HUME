name: Feature request
description: Suggest a new feature or a change to how HUME behaves.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How you would like HUME to behave. Keys, commands and examples help.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, including whether this could be a plugin or a few lines of `init.scm`.
