name: nightly

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Drift canary — uncomment to rebuild weekly even when main is quiet:
  # schedule:
  #   - cron: '0 4 * * 0'

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-archives.yml

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f nightly
          git push origin refs/tags/nightly --force
          gh release delete nightly --yes 2>/dev/null || true
          gh release create nightly dist/* \
            --title "Nightly (${{ github.sha }})" \
            --prerelease \
            --latest=false
