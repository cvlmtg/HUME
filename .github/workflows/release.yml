name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            layout: unix
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            layout: unix
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            layout: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so build.rs can read the git SHA

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p hume-editor --target ${{ matrix.target }}

      - name: Stage archive
        shell: bash
        run: bash scripts/stage.sh ${{ matrix.target }} ${{ matrix.layout }}

      - name: Pack tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd dist/stage
          tar czf "../$(ls).tar.gz" "$(ls)"

      - name: Pack zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = Get-ChildItem dist/stage | Select-Object -First 1 -ExpandProperty Name
          Compress-Archive -Path "dist/stage/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md entry found for version $version" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
