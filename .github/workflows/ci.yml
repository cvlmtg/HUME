name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Faster incremental compilation in CI — avoids re-linking unchanged crates.
  CARGO_INCREMENTAL: 0
  # Tighter debug info reduces artifact size without hiding symbol names.
  RUSTFLAGS: "-C debuginfo=1"

# Minimal token scope — this workflow only reads code and runs tests.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hang in an unbounded blocking test (e.g. a regression to the terminator's
    # drain-less spin — see hume-platform/src/unix.rs's terminator_tests module)
    # would otherwise burn the runner at 100% CPU until GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false   # run all three even if one fails — useful for OS-specific bugs
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache ~/.cargo/registry and the target directory between runs.
      # The cache key includes the OS and Cargo.lock so it is invalidated
      # whenever a dependency changes.
      - name: Cache Cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-targets

      # ── Grammar test fixtures ──────────────────────────────────────────────
      # Fixtures are grammar shared libraries (.so/.dylib/.dll) compiled from the
      # revisions in runtime/scheme/grammar-sources.scm (the shipped SSOT).
      # A helix-pin bump changes grammar-sources.scm and therefore the cache key,
      # triggering a rebuild. On Windows, MSVC dev tools are needed by tree-sitter build.
      #
      # The tree-sitter CLI is installed unconditionally (not gated on cache-hit)
      # because the live e2e test (HUME_REQUIRE_LIVE_GRAMMAR_E2E=1) runs its own
      # clone + tree-sitter build and needs the CLI regardless of fixture cache state.

      - name: Setup MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2.2

      - name: Cache grammar fixtures
        id: fixture-cache
        uses: actions/cache@v5
        with:
          path: tests/fixtures/grammars
          key: grammars-${{ runner.os }}-${{ hashFiles('scripts/fetch-test-grammars.sh','runtime/scheme/grammar-sources.scm') }}

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Build grammar fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/fetch-test-grammars.sh

      - name: Test
        env:
          HUME_REQUIRE_LIVE_GRAMMAR_E2E: "1"
          HUME_REQUIRE_GRAMMAR_FIXTURES: "1"
        run: cargo test --all-targets
