# Rosé Pine Moon — ported from rose-pine/helix's rose_pine_moon.toml.
# Author: Rosé Pine <hi@rosepinetheme.com>
#
# Source: https://github.com/rose-pine/helix/blob/2e8b94d54d48980ac9bbdfa6aae40b02227b71c3/rose_pine_moon.toml
# License: licenses/rose_pine.license
#
# Same as upstream, plus HUME's own additions and deviations marked inline
# below (see the "HUME additions" marker).

inherits = "rose_pine"

[palette]
base           = "#232136" 
surface        = "#2a273f" 
overlay        = "#393552"
muted          = "#6e6a86"
subtle         = "#908caa"
text           = "#e0def4"
love           = "#eb6f92"
love_10        = "#3a2841"
gold           = "#f6c177"
gold_10        = "#39313e"
rose           = "#ea9a97"
rose_10        = "#392d41"
pine           = "#3e8fb0"
pine_10        = "#252c44"
foam           = "#9ccfd8"
foam_10        = "#2e3248"
iris           = "#c4a7e7"
iris_10        = "#342e4a"
highlight_low  = "#2a283e"
highlight_med  = "#44415a"
highlight_high = "#56526e"

# HUME additions — inline-diagnostic and diff tints, each a palette color
# blended toward `base`.
error_inline = "#af5876"
warning_inline = "#b79164"
info_inline = "#789ba7"
hint_inline = "#947fb2"
diff_plus_bg = "#394053"
diff_plus_word_bg = "#4f6070"
diff_minus_bg = "#472f47"
diff_minus_word_bg = "#6b3d57"
diff_delta_bg = "#3f3244"
