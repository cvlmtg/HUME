# HUME built-in light theme.
# Inherits from dark and overrides the colors that need to change for a light
# terminal background.
#
inherits = "dark"

# ── Cursor ────────────────────────────────────────────────────────────────────
"ui.cursor.primary" = { fg = "white", bg = "black" }
"ui.cursor"         = { fg = "white", bg = "mid_gray" }

# ── Selection / cursor-line ───────────────────────────────────────────────────
"ui.selection"  = { bg = "selection" }
"ui.cursorline" = { bg = "cursor_line" }

# ── Text focus (picker selected row) ──────────────────────────────────────────
"ui.text.focus" = { fg = "#f5f5f5", bg = "#6060a0" }

# ── Gutter ────────────────────────────────────────────────────────────────────
"ui.linenr"          = { fg = "mid_gray" }
"ui.linenr.selected" = { fg = "#303030" }

# ── Highlights ────────────────────────────────────────────────────────────────
"ui.cursor.match"     = { fg = "#7c5c00", bg = "#fde68a", modifiers = ["bold"] }
"ui.selection.search" = { fg = "#7c2800", bg = "#fed7aa" }

# ── Diagnostics ───────────────────────────────────────────────────────────────
# Redeclared (not inherited) so these resolve against this file's own
# lighter-background-appropriate palette below
"diagnostic.error"   = { fg = "red",    modifiers = ["underlined"] }
"diagnostic.warning" = { fg = "yellow", modifiers = ["underlined"] }
"diagnostic.info"    = { fg = "cyan",   modifiers = ["underlined"] }
"diagnostic.hint"    = { fg = "green",  modifiers = ["underlined"] }

# :messages severity badge/body — redeclared (not inherited) for the same
# reason as diagnostic.* above;
"diagnostic.error.message"        = { fg = "white", bg = "red" }
"diagnostic.warning.message"      = { fg = "white", bg = "yellow" }
"diagnostic.info.message"         = { fg = "white", bg = "cyan" }
"diagnostic.hint.message"         = { fg = "white", bg = "green" }
"diagnostic.error.message-text"   = { fg = "red" }
"diagnostic.warning.message-text" = { fg = "yellow" }
"diagnostic.info.message-text"    = { fg = "cyan" }
"diagnostic.hint.message-text"    = { fg = "green" }

# ── Diff ──────────────────────────────────────────────────────────────────────
# Redeclared for the same reason as diagnostics above — re-resolve against
# this file's palette instead of inheriting dark's colors.
"diff.plus"         = { fg = "white", bg = "diff_plus_bg" }
"diff.minus"        = { fg = "white", bg = "diff_minus_bg" }
"diff.delta"        = { fg = "white", bg = "diff_delta_bg" }
"diff.plus.gutter"  = { fg = "green" }
"diff.minus.gutter" = { fg = "red" }
"diff.delta.gutter" = { fg = "cyan" }
# Word-level segments (`diff.*.word`) mark the exact changed span inside a
# `diff.plus`/`diff.minus`-tinted row
"diff.plus.word"    = { fg = "white", bg = "diff_plus_word_bg", modifiers = ["bold"] }
"diff.minus.word"   = { fg = "white", bg = "diff_minus_word_bg", modifiers = ["bold", "crossed_out"] }

# ── Whitespace ────────────────────────────────────────────────────────────────
"ui.whitespace" = { fg = "#c0c0c8" }

# ── Inlay hints ───────────────────────────────────────────────────────────────
"ui.virtual.inlay-hint" = { fg = "#a0a0a8" }

# ── Completion popup ──────────────────────────────────────────────────────────
"ui.menu"          = { fg = "#606078", bg = "#d8d8ec" }
"ui.menu.selected" = { fg = "#f5f5f5", bg = "#6060a0" }
"ui.menu.scroll"   = { fg = "blue", bg = "#d8d8ec" }

# ── Hover / signature-help popup ────────────────────────────────────────────────
"ui.popup" = { fg = "#1a1a1a", bg = "#d8d8ec" }
"ui.popup.scroll" = { fg = "blue", bg = "#d8d8ec" }

# ── Bottom drawer (location lists, etc.) ────────────────────────────────────────
"ui.drawer" = { fg = "#606078", bg = "#d8d8ec" }

# ── Statusline ────────────────────────────────────────────────────────────────
"ui.statusline"           = { fg = "statusline_fg", bg = "statusline" }
"ui.statusline.normal"    = { fg = "statusline_fg", bg = "statusline" }
"ui.statusline.insert"    = { fg = "white",         bg = "cyan" }
"ui.statusline.extend"    = { fg = "white",         bg = "yellow" }
"ui.statusline.search"    = { fg = "white",         bg = "magenta" }
"ui.statusline.command"   = { fg = "white",         bg = "green" }
"ui.statusline.select"    = { fg = "white",         bg = "blue" }
"ui.statusline.separator" = { fg = "light_gray" }

[palette]
white              = "#f5f5f5"
black              = "#1a1a1a"
red                = "#a02020"
mid_gray           = "#9090a0"
# Lighter than mid_gray specifically for the separator: it sits on the
# saturated dark row backgrounds below (cyan/yellow/magenta/green/blue),
# where mid_gray's contrast is too low to read as a divider.
light_gray         = "#c8c8d2"
cursor_line        = "#e8e8f0"
selection          = "#b8b8e8"
statusline         = "#1a1a1a"
statusline_fg      = "#f5f5f5"
cyan               = "#007878"
yellow             = "#787800"
magenta            = "#780078"
green              = "#007800"
blue               = "#0000bb"
diff_plus_bg       = "#152B15"
diff_plus_word_bg  = "#103E10"
diff_minus_bg      = "#321B1B"
diff_minus_word_bg = "#4D1C1C"
diff_delta_bg      = "#152B2B"
