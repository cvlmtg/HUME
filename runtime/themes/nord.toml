# License, v. 2.0. If a copy of the MPL was not distributed with this
# file, You can obtain one at https://mozilla.org/MPL/2.0/.
#
# Same as upstream, plus HUME's own additions and deviations marked inline
# below (see the "HUME additions" marker).

## SYNTAX HIGHLIGHTING

# Constants
"constant" = "nord4"
"constant.builtin" = "nord9"
"constant.builtin.boolean" = "nord9"
"constant.builtin.character" = "nord15"
"constant.character.escape" = "nord13"
"constant.macro" = "nord9"
"constant.numeric" = "nord15"
"constructor" = "nord8"

# Diagnostics
"diagnostic" = { underline = { color = "nord13", style = "curl" } }
# `fg` added to each (upstream sets only `underline`): a plugin-defined
# sub-scope like "diagnostic.warning.<marker>" falls back to this scope by
# dot-notation and needs a real color, not just an underline, to resolve to.
"diagnostic.error" = { fg = "nord11", underline = { color = "nord11", style = "curl" } }
"error" = "nord11"
"diagnostic.hint" = { fg = "nord10", underline = { color = "nord10", style = "curl" } }
"hint" = "nord10"
"diagnostic.info" = { fg = "nord8", underline = { color = "nord8", style = "curl" } }
"info" = "nord8"
"diagnostic.warning" = { fg = "nord13", underline = { color = "nord13", style = "curl" } }
"warning" = "nord13"
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

# Diffs
"diff.delta" = "nord13"
"diff.minus" = "nord11"
"diff.plus" = "nord14"

# Functions
"function" = "nord8"
"function.builtin" = "nord7"
"function.method" = "nord8"
"function.macro" = "nord9"
"function.special" = "nord9"

# Git
"git.delta.moved" = "nord12"

# Keywords
"keyword" = "nord9"
"keyword.control.conditional" = "nord9"
"keyword.control.exception" = "nord9"
"keyword.control.repeat" = "nord9"
"keyword.directive" = "nord9"
"keyword.function" = "nord9"
"keyword.operator" = "nord9"
"keyword.return" = "nord9"
"keyword.storage.modifier" = "nord9"
"keyword.storage.type" = "nord9"

# Punctuation
"punctuation" = "nord6"
"punctuation.bracket" = "nord6"
"punctuation.delimiter" = "nord6"
"punctuation.special" = "nord9"

# Strings
"string" = "nord14"
"string.escape" = "nord13"
"string.regex" = "nord13"
"string.special" = "nord13"

# Types
"type" = "nord7"
"type.builtin" = "nord7"

# Variables
"variable" = "nord4"
"variable.builtin" = "nord9"
"variable.other.member" = "nord4"
"variable.parameter" = "nord8"
"attribute" = "nord9"

# Misc.
"label" = "nord7"
"namespace" = "nord4"
"operator" = "nord9"
"special" = "nord9"
"tag" = "nord7"
"comment" = { fg = "nord3_bright", modifiers = ["italic"] }

## EDITOR UI COLORS

"ui.background" = { bg = "nord0" }
"ui.text" = "nord4"
"ui.window" = "nord1"

# Debug
"ui.debug.active" = "nord13"
"ui.debug.breakpoint" = "nord11"

# Popus and menus
"ui.menu" = { bg = "nord1" }
"ui.menu.scroll" = { fg = "nord4", bg = "nord3" }
"ui.menu.selected" = { fg = "nord8", bg = "nord2" }
"ui.popup" = { bg = "nord1" }
"ui.popup.info" = { bg = "nord1" }
"ui.help" = { bg = "nord1" }
"ui.text.focus" = { fg = "nord8", bg = "nord2" }

# Gutter
"ui.gutter" = "nord5"
"ui.linenr" = "nord3"
"ui.linenr.selected" = "nord5"

# Cursor
"ui.cursor" = { fg = "nord4", modifiers = ["reversed"] }
"ui.cursorcolumn.primary" = { bg = "nord1" }
"ui.cursorline.primary" = { bg = "nord1" }
"ui.cursor.match" = { bg = "nord3" }

"ui.selection" = { bg = "nord3" }
"ui.highlight" = { fg = "nord8", bg = "nord2" }

# Statusline
"ui.statusline" = { bg = "nord1" }
"ui.statusline.inactive" = { fg = "nord8", bg = "nord1" }
"ui.statusline.insert" = { fg = "nord1", bg = "nord6" }
"ui.statusline.normal" = { fg = "nord1", bg = "nord8" }
"ui.statusline.select" = { fg = "nord1", bg = "nord7" }
"ui.statusline.separator" = "nord3"

# Virtual/invisible text
"ui.virtual.indent-guide" = "nord3"
"ui.virtual.inlay-hint" = { fg = "nord3", modifiers = ["italic"] }
"ui.virtual.jump-label" = { fg = "nord11", modifiers = ["bold"] }
"ui.virtual.ruler" = { bg = "nord1" }
"ui.virtual.whitespace" = "nord3"
"ui.virtual.wrap" = "nord3"

# Bufferline
"ui.bufferline" = { fg = "nord5", bg = "nord1" }
"ui.bufferline.active" = { fg = "nord6", bg = "nord2", underline = { color = "nord8", style = "line" }, modifiers = [
  "italic",
] }

# Markup
"markup.heading" = "nord8"
"markup.list" = "nord9"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.text" = "nord8"
"markup.raw" = "nord7"

# Rainbow brackets
# `rainbow` removed: HUME has no rainbow brackets, and its loader reports
# the array as an unreadable scope value.

# ── HUME additions ─────────────────────────────────────────────────────────
# Scopes below have no value upstream. Values draw only on the palette
# below, chosen to sit naturally alongside it.

# Focused-pane seam accent (`ui.window` above is the unfocused seam).
"ui.window.focused" = { fg = "nord8" }

# Every visible search match, distinct from the bracket-match
# `ui.cursor.match` above.
"ui.cursor.match.search" = { fg = "nord1", bg = "nord13" }

# Base virtual text (tilde filler, EOF marker).
"ui.virtual" = { fg = "nord3_bright" }

# The `<200b>` stand-in for a character the terminal must not be shown. Not
# muted like the rest of `ui.virtual`: a bidi override hiding in source is
# what this has to catch the eye for.
"ui.virtual.invisible" = { fg = "nord1", bg = "nord11" }

# Mode rows. The whole statusline tints with the mode's style, so each
# mode needs its own `bg` (Extend reads Helix's `ui.statusline.select`).
"ui.statusline.search" = { fg = "nord1", bg = "nord12", modifiers = ["bold"] }
"ui.statusline.command" = { fg = "nord1", bg = "nord15", modifiers = ["bold"] }
"ui.statusline.sift" = { fg = "nord1", bg = "nord14", modifiers = ["bold"] }

# Tab bar, a HUME-only surface distinct from Helix's own `ui.bufferline*`.
"ui.tabline" = { fg = "nord4", bg = "nord1" }
"ui.tabline.active" = { fg = "nord6", bg = "nord2", modifiers = ["bold"] }

"ui.popup.scroll" = { fg = "nord4", bg = "nord3" }
"ui.drawer" = { fg = "nord4", bg = "nord1" }

# End-of-line diagnostic summary. Its own scope so this virtual text carries
# no `underlined` modifier from the `diagnostic.*` squiggle above; muted
# against that squiggle so the line's own code stays the brighter thing.
"error.diagnostic.inline" = { fg = "error_inline" }
"warning.diagnostic.inline" = { fg = "warning_inline" }
"info.diagnostic.inline" = { fg = "info_inline" }
"hint.diagnostic.inline" = { fg = "hint_inline" }

# :messages severity badge/body
"diagnostic.error.message" = { fg = "nord1", bg = "nord11" }
"diagnostic.warning.message" = { fg = "nord1", bg = "nord13" }
"diagnostic.info.message" = { fg = "nord1", bg = "nord8" }
"diagnostic.hint.message" = { fg = "nord1", bg = "nord10" }
"diagnostic.error.message-text" = { fg = "nord11" }
"diagnostic.warning.message-text" = { fg = "nord13" }
"diagnostic.info.message-text" = { fg = "nord8" }
"diagnostic.hint.message-text" = { fg = "nord10" }

# Whole-line diff tint (see the manual's Themes section for the details).
"diff.plus.line" = { bg = "diff_plus_bg" }
"diff.minus.line" = { fg = "nord4", bg = "diff_minus_bg" }
"diff.delta.line" = { bg = "diff_delta_bg" }

# Word-level segments mark the exact changed span inside a
# `diff.plus.line`/`diff.minus.line`-tinted line.
"diff.plus.word" = { fg = "nord4", bg = "diff_plus_word_bg", modifiers = ["bold"] }
"diff.minus.word" = { fg = "nord4", bg = "diff_minus_word_bg", modifiers = ["bold", "crossed_out"] }

# Markdown scopes upstream leaves unset.
"markup.heading.marker" = { fg = "nord3" }
"markup.link" = { fg = "nord8", modifiers = ["underlined"] }

[palette]
# Polar Night is made up of four darker colors that are commonly used for base elements like backgrounds or text color in bright ambiance designs.
#
# The origin color or the Polar Night palette
nord0 = "#2e3440"
# A brighter shade color based on nord0
nord1 = "#3B4252"
# An even more brighter shade color of nord0
nord2 = "#434C5E"
# The brightest shade color based on nord0
nord3 = "#4C566A"
# 10% brighter for comments, see https://github.com/nordtheme/nord/issues/94
nord3_bright = "#616e88"

# Snow Storm is made up of three bright colors that are commonly used for text colors or base UI elements in bright ambiance designs.
# The origin color or the Snow Storm palette
nord4 = "#D8DEE9"
# A brighter shade color of nord4
nord5 = "#E5E9F0"
# The brightest shade color based on nord4
nord6 = "#ECEFF4"

# Frost can be described as the heart palette of Nord, a group of four bluish colors that are commonly used for primary UI component and text highlighting and essential code syntax elements.
#
# A calm and highly contrasted color reminiscent of frozen polar water
nord7 = "#8FBCBB"
# The bright and shiny primary accent color reminiscent of pure and clear ice
nord8 = "#88C0D0"
# A more darkened and less saturated color reminiscent of arctic waters
nord9 = "#81A1C1"
# A dark and intensive color reminiscent of the deep arctic ocean
nord10 = "#5E81AC"

# Aurora consists of five colorful components reminiscent of the "Aurora borealis", sometimes referred to as polar lights or northern lights.
#
# Red
nord11 = "#BF616A"
# Orange
nord12 = "#D08770"
# Yellow
nord13 = "#EBCB8B"
# Green
nord14 = "#A3BE8C"
# Purple
nord15 = "#B48EAD"

# HUME additions — inline-diagnostic and diff tints, each a palette color
# blended toward `nord0`.
error_inline = "#94545d"
warning_inline = "#b29e74"
info_inline = "#6d96a5"
hint_inline = "#506a8c"
diff_plus_bg = "#434d4e"
diff_plus_word_bg = "#58665b"
diff_minus_bg = "#483c48"
diff_minus_word_bg = "#62444f"
diff_delta_bg = "#3a4352"
