# Nord — ported from Helix's runtime/themes/nord.toml.
# Nord (Dark Ambiance) port for Helix (https://helix-editor.com/)
# https://docs.helix-editor.com/themes.html
# https://www.nordtheme.com/docs/colors-and-palettes
#
# Source: https://github.com/helix-editor/helix/blob/ba40e547426b0f9896c8bdc699a4ab11f2b37dbc/runtime/themes/nord.toml
# License: licenses/nord.license
#
