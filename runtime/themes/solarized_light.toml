# Solarized Light — ported from Helix's runtime/themes/solarized_light.toml.
# Source: https://github.com/helix-editor/helix/blob/ba40e547426b0f9896c8bdc699a4ab11f2b37dbc/runtime/themes/solarized_light.toml
# License: licenses/solarized.license
#
# This Source Code Form is subject to the terms of the Mozilla Public
# License, v. 2.0. If a copy of the MPL was not distributed with this
# file, You can obtain one at https://mozilla.org/MPL/2.0/.
#
# Same as upstream, plus HUME's own additions and deviations marked inline
# below (see the "HUME additions" marker).

"attribute" = { fg = "violet" }
"keyword" = { fg = "green" }
"keyword.directive" = { fg = "orange" }
"namespace" = { fg = "violet" }
"operator" = { fg = "green" }
"special" = { fg = "orange" }
"variable.builtin" = { fg = "cyan", modifiers = ["bold"] }
"variable.function" = { fg = "blue" }
"type" = { fg = "yellow" }
"type.builtin" = { fg = "yellow", modifiers = ["bold"] }
"constructor" = { fg = "blue" }
"function" = { fg = "blue" }
"function.macro" = { fg = "magenta" }
"function.builtin" = { fg = "blue", modifiers = ["bold"] }
"function.special" = { fg = "magenta" }
"comment" = { fg = "base01" }
"string" = { fg = "cyan" }
"constant" = { fg = "cyan" }
"constant.builtin" = { fg = "cyan", modifiers = ["bold"] }
"constant.character.escape" = { fg = "red", modifiers = ["bold"] }
"label" = { fg = "green" }
"module" = { fg = "violet" }
"tag" = { fg = "magenta" }

# TODO
"markup.heading" = "blue"
"markup.list" = "red"
"markup.bold" = { fg = "yellow", modifiers = ["bold"] }
"markup.italic" = { fg = "magenta", modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "yellow", modifiers = ["underlined"] }
"markup.link.text" = "red"
"markup.quote" = "cyan"
"markup.raw" = "green"

"diff.plus" = { fg = "green" }
"diff.delta" = { fg = "yellow" }
"diff.minus" = { fg = "red" }

# 背景
# background
"ui.background" = { bg = "base03" }

"ui.virtual.whitespace" = { fg = "base01" }
"ui.virtual.inlay-hint" = { fg = "base01", modifiers = ["italic"] }
"ui.virtual.jump-label" = { fg = "red", modifiers = ["bold"] }

# 行号栏
# line number column
"ui.linenr" = { fg = "base0", bg = "base02" }
# 当前行号栏
# current line number column
"ui.linenr.selected" = { fg = "blue", modifiers = ["bold"] }
# cursorline
"ui.cursorline" = { bg = "base0" }

# 状态栏
# status bar
"ui.statusline" = { fg = "base03", bg = "base0" }
"ui.statusline.normal" = { bg = "blue" }
"ui.statusline.insert" = { bg = "green" }
"ui.statusline.select" = { bg = "yellow" }

# 非活动状态栏
# inactive status bar
"ui.statusline.inactive" = { fg = "base1", bg = "base01" }

# 补全窗口, preview窗口
# Completion window, preview window
"ui.popup" = { bg = "base02" }
# 影响 补全选中 cmd弹出信息选中
# Affect completion selection, cmd pop-up information selection
"ui.menu.selected" = { fg = "base02", bg = "base2"}
"ui.menu" = { fg = "base0", bg = "base02" }
# ??
"ui.window" = { fg = "base3" }
# 命令行 补全的帮助信息
# Command line completion help information
"ui.help" = { modifiers = ["reversed"] }

# 快捷键窗口 
# Shortcut window
"ui.popup.info" = { bg = "base1" }
# 快捷键字体
# Shortcut font
"ui.text.info" = {fg = "base02", modifiers = ["bold"]}

# 普通ui的字体样式
# Normal ui font style
"ui.text" = { fg = "base1" }
# 影响 picker列表选中, 快捷键帮助窗口文本
# Affects picker list selection, shortcut key help window text
"ui.text.focus" = { fg = "blue", modifiers = ["bold"]}

# 主光标/selection
# main cursor/selection
"ui.cursor.primary" = { fg = "base03", bg = "base1" }
"ui.cursor.select" = { fg = "base02", bg = "cyan" }

"ui.cursorline.primary" = { bg = "base02" }
"ui.cursorline.secondary" = { bg = "base025" }

"ui.selection" = { bg = "base0175" }
"ui.selection.primary" = { bg = "base015" }

"ui.virtual.indent-guide" = { fg = "base02" }
"ui.virtual.ruler" = { bg = "base02" }

# normal模式的光标
# normal mode cursor
"ui.cursor" = {fg = "base02", bg = "cyan"}
"ui.cursor.insert" = {fg = "base03", bg = "base3"}
# 当前光标匹配的标点符号
# The punctuation character matched by the current cursor
"ui.cursor.match" = { fg = "base02", bg = "base015" }

# `underlined` dropped from these gutter scopes: HUME draws them as sign
# glyphs, and the underline belongs to the `diagnostic.*` squiggle below.
"warning" =  { fg = "orange", modifiers= ["bold"] }
"error" = { fg = "red", modifiers= ["bold"] }
"info" = { fg = "blue", modifiers= ["bold"] }
"hint" = { fg = "base01", modifiers= ["bold"] }

# `fg` added to each (upstream sets only `underline`): a plugin-defined
# sub-scope like "diagnostic.warning.<marker>" falls back to this scope by
# dot-notation and needs a real color, not just an underline, to resolve to.
"diagnostic.warning" = { fg = "orange", underline = { style = "curl", color = "orange" } }
"diagnostic.error" = { fg = "red", underline = { style = "curl", color = "red" } }
"diagnostic.info" = { fg = "blue", underline = { style = "curl", color = "blue" } }
"diagnostic.hint" = { fg = "base01", underline = { style = "curl", color = "base01" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

# ── HUME additions ─────────────────────────────────────────────────────────
# Scopes below have no value upstream. Values draw only on the palette
# below, chosen to sit naturally alongside it.

# Focused-pane seam accent (`ui.window` above is the unfocused seam).
"ui.window.focused" = { fg = "blue" }

# Every visible search match, distinct from the bracket-match
# `ui.cursor.match` above.
"ui.cursor.match.search" = { fg = "base03", bg = "yellow" }

# Base virtual text (tilde filler, EOF marker).
"ui.virtual" = { fg = "base01" }

# The `<200b>` stand-in for a character the terminal must not be shown. Not
# muted like the rest of `ui.virtual`: a bidi override hiding in source is
# what this has to catch the eye for.
"ui.virtual.invisible" = { fg = "base03", bg = "red" }

# Mode rows. The whole statusline tints with the mode's style, so each
# mode needs its own `bg` (Extend reads Helix's `ui.statusline.select`).
"ui.statusline.search" = { fg = "base03", bg = "orange", modifiers = ["bold"] }
"ui.statusline.command" = { fg = "base03", bg = "violet", modifiers = ["bold"] }
"ui.statusline.sift" = { fg = "base03", bg = "cyan", modifiers = ["bold"] }
"ui.statusline.separator" = { fg = "base01" }

# Tab bar, a HUME-only surface distinct from Helix's own `ui.bufferline*`.
"ui.tabline" = { fg = "base01", bg = "base02" }
"ui.tabline.active" = { fg = "base03", bg = "base0", modifiers = ["bold"] }

"ui.popup.scroll" = { fg = "base01", bg = "base02" }
"ui.menu.scroll" = { fg = "base01", bg = "base02" }
"ui.drawer" = { fg = "base0", bg = "base02" }

# End-of-line diagnostic summary. Its own scope so this virtual text carries
# no `underlined` modifier from the `diagnostic.*` squiggle above; muted
# against that squiggle so the line's own code stays the brighter thing.
"error.diagnostic.inline" = { fg = "error_inline" }
"warning.diagnostic.inline" = { fg = "warning_inline" }
"info.diagnostic.inline" = { fg = "info_inline" }
"hint.diagnostic.inline" = { fg = "hint_inline" }

# :messages severity badge/body
"diagnostic.error.message" = { fg = "base03", bg = "red" }
"diagnostic.warning.message" = { fg = "base03", bg = "orange" }
"diagnostic.info.message" = { fg = "base03", bg = "blue" }
"diagnostic.hint.message" = { fg = "base03", bg = "base01" }
"diagnostic.error.message-text" = { fg = "red" }
"diagnostic.warning.message-text" = { fg = "orange" }
"diagnostic.info.message-text" = { fg = "blue" }
"diagnostic.hint.message-text" = { fg = "base01" }

# Whole-line diff tint (see the manual's Themes section for the details).
"diff.plus.line" = { bg = "diff_plus_bg" }
"diff.minus.line" = { fg = "base0", bg = "diff_minus_bg" }
"diff.delta.line" = { bg = "diff_delta_bg" }

# Word-level segments mark the exact changed span inside a
# `diff.plus.line`/`diff.minus.line`-tinted line.
"diff.plus.word" = { fg = "base0", bg = "diff_plus_word_bg", modifiers = ["bold"] }
"diff.minus.word" = { fg = "base0", bg = "diff_minus_word_bg", modifiers = ["bold", "crossed_out"] }

# Markdown scopes upstream leaves unset.
"markup.heading.marker" = { fg = "base01" }
"markup.link" = { fg = "blue", modifiers = ["underlined"] }

[palette]
red      = '#dc322f'
green    = '#859900'
yellow   = '#b58900'
blue     = '#268bd2'
magenta  = '#d33682'
cyan     = '#2aa198'
orange   = '#cb4b16'
violet   = '#6c71c4'

# 深色 越来越深
# dark getting darker
base0    = '#657b83'
base1    = '#586e75'
base2    = '#073642'
base3    = '#002b36'

# 浅色 越來越浅
# Lighter and lighter
base00   = '#839496'
base01   = '#93a1a1'
base015  = '#c5c8bd'
base0175 = '#dddbcc'
base02   = '#eee8d5'
base025  = '#f5eedb'
base03   = '#fdf6e3'

# HUME additions — inline-diagnostic and diff tints, each a palette color
# blended toward `base03`.
error_inline = "#e66d65"
warning_inline = "#da7e54"
info_inline = "#66abd7"
hint_inline = "#b3bab5"
diff_plus_bg = "#e7e5ba"
diff_plus_word_bg = "#d2d591"
diff_minus_bg = "#f7d3c3"
diff_minus_word_bg = "#f1afa2"
diff_delta_bg = "#dfe7e1"
