"attribute" = "lotusAutumnRed"
"type" = { fg = "lotusSuperAqua" }
"type.builtin" = { fg = "lotusBlue3" }
"constructor" = { fg = "lotusBlue3" }
"constant" = { fg = "lotusSuperOrange" }
"constant.numeric" = { fg = "lotusSuperPink" }
"constant.character.escape" = { fg = "lotusYellow2" }
"string" = { fg = "lotusSuperBlue" }
"string.regexp" = { fg = "lotusYellow2" }
"string.special.url" = { fg = "lotusSuperGreen" }
"string.special.symbol" = { fg = "lotusSuperViolet" }
"comment" = { fg = "lotusInk1", modifiers = ["italic"] }
"variable" = { fg = "lotusInk0" }
"variable.builtin" = { fg = "lotusAutumnRed" }
"variable.parameter" = { fg = "lotusSuperViolet" }
"variable.other.member" = { fg = "lotusSuperOrange" }
"label" = { fg = "lotusBlue3" }
"punctuation" = { fg = "lotusPunctuation" }
"keyword" = { fg = "lotusSuperViolet", modifiers = ["italic"] }
"keyword.control.return" = { fg = "lotusSuperPink" }
"keyword.control.exception" = { fg = "lotusSuperPink" }
"keyword.directive" = { fg = "lotusAutumnRed" }
"operator" = { fg = "lotusBrightPink", modifiers = ["bold"] }
"function" = { fg = "lotusBlue2" }
"function.builtin" = { fg = "lotusCyan" }
"function.macro" = { fg = "lotusAutumnRed" }
"tag" = { fg = "lotusSuperAqua" }
"namespace" = { fg = "lotusSuperOrange" }
"special" = { fg = "lotusSuperPink" }

## Markup modifiers
"markup.heading" = { fg = "lotusBlue3", modifiers = ["bold"] }
"markup.heading.marker" = "lotusBlue3"
"markup.heading.1" = { fg = "lotusYellow", modifiers = ["bold"] }
"markup.heading.2" = { fg = "lotusBlue3", modifiers = ["bold"] }
"markup.heading.3" = { fg = "lotusSuperAqua", modifiers = ["bold"] }
"markup.list" = { fg = "lotusSuperPink" }
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.text" = { fg = "lotusBlue3" }
"markup.link.url" = { fg = "lotusCyan" }
"markup.link.label" = { fg = "lotusSuperOrange" }
"markup.quote" = { fg = "lotusViolet", modifiers = ["italic"] }
"markup.raw" = { fg = "lotusSuperGreen" }

# ── HUME additions ─────────────────────────────────────────────────────────
# Scopes below have no value upstream. Values draw only on the palette
# below, chosen to sit naturally alongside it.

# Focused-pane seam accent (`ui.window` above is the unfocused seam).
"ui.window.focused" = { fg = "lotusBlue2" }

# Every visible search match, distinct from the bracket-match
# `ui.cursor.match` above.
"ui.cursor.match.search" = { fg = "lotusWhite0", bg = "lotusYellow2" }

# The `<200b>` stand-in for a character the terminal must not be shown. Not
# muted like the rest of `ui.virtual`: a bidi override hiding in source is
# what this has to catch the eye for.
"ui.virtual.invisible" = { fg = "lotusWhite0", bg = "lotusRed" }

# Mode rows. The whole statusline tints with the mode's style, so each
# mode needs its own `bg` (Extend reads Helix's `ui.statusline.select`).
"ui.statusline.search" = { fg = "lotusWhite0", bg = "lotusSuperOrange", modifiers = ["bold"] }
"ui.statusline.command" = { fg = "lotusWhite0", bg = "lotusCyan", modifiers = ["bold"] }
"ui.statusline.sift" = { fg = "lotusWhite0", bg = "lotusBrightPink", modifiers = ["bold"] }
"ui.statusline.separator" = { fg = "lotusInk1" }

# Tab bar, a HUME-only surface distinct from Helix's own `ui.bufferline*`.
"ui.tabline" = { fg = "lotusInk1", bg = "lotusWhite2" }
"ui.tabline.active" = { fg = "lotusInk0", bg = "lotusBlue1", modifiers = ["bold"] }

"ui.popup.scroll" = { fg = "lotusInk1", bg = "lotusWhite2" }
"ui.drawer" = { fg = "lotusInk0", bg = "lotusWhite1" }

# End-of-line diagnostic summary. Its own scope so this virtual text carries
# no `underlined` modifier from the `diagnostic.*` squiggle above; muted
# against that squiggle so the line's own code stays the brighter thing.
"error.diagnostic.inline" = { fg = "error_inline" }
"warning.diagnostic.inline" = { fg = "warning_inline" }
"info.diagnostic.inline" = { fg = "info_inline" }
"hint.diagnostic.inline" = { fg = "hint_inline" }

# :messages severity badge/body
"diagnostic.error.message" = { fg = "lotusWhite0", bg = "lotusRed" }
"diagnostic.warning.message" = { fg = "lotusWhite0", bg = "lotusBrightOrange" }
"diagnostic.info.message" = { fg = "lotusWhite0", bg = "lotusBlue3" }
"diagnostic.hint.message" = { fg = "lotusWhite0", bg = "lotusGreen" }
"diagnostic.error.message-text" = { fg = "lotusRed" }
"diagnostic.warning.message-text" = { fg = "lotusBrightOrange" }
"diagnostic.info.message-text" = { fg = "lotusBlue3" }
"diagnostic.hint.message-text" = { fg = "lotusGreen" }

# Whole-line diff tint (see the manual's Themes section for the details).
"diff.plus.line" = { bg = "diff_plus_bg" }
"diff.minus.line" = { fg = "lotusInk0", bg = "diff_minus_bg" }
"diff.delta.line" = { bg = "diff_delta_bg" }

# Word-level segments mark the exact changed span inside a
# `diff.plus.line`/`diff.minus.line`-tinted line.
"diff.plus.word" = { fg = "lotusInk0", bg = "diff_plus_word_bg", modifiers = ["bold"] }
"diff.minus.word" = { fg = "lotusInk0", bg = "diff_minus_word_bg", modifiers = ["bold", "crossed_out"] }

# Markdown scopes upstream leaves unset.
"markup.link" = { fg = "lotusBlue2", modifiers = ["underlined"] }

