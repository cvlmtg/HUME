# HUME built-in dark theme.
# A flat, no-dependency theme for dark terminals (the editor default aesthetic).
# All colors are explicit hex values so this file exercises the basic loader path.
#
# Note: [palette] must come after all scope definitions (TOML section semantics).

# ── Base text ─────────────────────────────────────────────────────────────────
# Base foreground for plain (unhighlighted) text — folded into `theme.default`
# so it can be dimmed like syntax-highlighted spans (see loader.rs).
"ui.text" = { fg = "fg" }
"ui.text.focus" = { fg = "#ffffff", bg = "#50508c" }

# ── Cursor ────────────────────────────────────────────────────────────────────
"ui.cursor.primary" = { fg = "black", bg = "white" }
"ui.cursor"         = { fg = "black", bg = "mid_gray" }

# ── Selection / cursor-line ───────────────────────────────────────────────────
"ui.selection"  = { bg = "selection" }
"ui.cursorline" = { bg = "cursor_line" }

# ── Virtual text / tilde rows ─────────────────────────────────────────────────
"ui.virtual" = { fg = "dark_gray" }
"ui.virtual.inlay-hint" = { fg = "dark_gray" }

# ── Gutter ────────────────────────────────────────────────────────────────────
"ui.linenr"          = { fg = "dark_gray" }
"ui.linenr.selected" = { fg = "#c8c8d2" }

# ── Highlights ────────────────────────────────────────────────────────────────
"ui.cursor.match"    = { fg = "#dcb432", bg = "#3c3714", modifiers = ["bold"] }
"ui.selection.search" = { fg = "#ffb450", bg = "#502800" }

# ── Diagnostics ───────────────────────────────────────────────────────────────
"diagnostic.error"   = { fg = "red",    modifiers = ["underlined"] }
"diagnostic.warning" = { fg = "yellow", modifiers = ["underlined"] }
"diagnostic.info"    = { fg = "cyan",   modifiers = ["underlined"] }
"diagnostic.hint"    = { fg = "green",  modifiers = ["underlined"] }

# ── Whitespace ────────────────────────────────────────────────────────────────
"ui.whitespace" = { fg = "#464650" }

# ── Pane background / seam dividers ─────────────────────────────────────────────
"ui.background"     = { bg = "bg" }
"ui.window"         = { fg = "dark_gray" }
"ui.window.focused" = { fg = "syn_keyword" }

# ── Syntax highlighting (tree-sitter) ─────────────────────────────────────────
"comment"               = { fg = "syn_comment",  modifiers = ["italic"] }
"string"                = { fg = "syn_string" }
"string.special.key"    = { fg = "syn_string" }
"escape"                = { fg = "syn_escape" }
"constant.numeric"      = { fg = "syn_number" }
"constant.builtin"      = { fg = "syn_const" }
"keyword"               = { fg = "syn_keyword",  modifiers = ["bold"] }
"keyword.control"       = { fg = "syn_keyword",  modifiers = ["bold"] }
"keyword.function"      = { fg = "syn_keyword",  modifiers = ["bold"] }
"keyword.operator"      = { fg = "syn_keyword" }
"function"              = { fg = "syn_function" }
"function.method"       = { fg = "syn_function" }
"function.builtin"      = { fg = "syn_function", modifiers = ["italic"] }
"type"                  = { fg = "syn_type" }
"type.builtin"          = { fg = "syn_type",     modifiers = ["bold"] }
"variable"              = { fg = "fg" }
"variable.builtin"      = { fg = "syn_const" }
"variable.parameter"    = { fg = "syn_param" }
"operator"              = { fg = "fg" }
"punctuation"           = { fg = "dark_gray" }
"punctuation.delimiter" = { fg = "dark_gray" }
"punctuation.bracket"   = { fg = "mid_gray" }
"label"                 = { fg = "syn_escape" }
"attribute"             = { fg = "syn_type" }
"namespace"             = { fg = "syn_param" }

# ── Completion popup ──────────────────────────────────────────────────────────
"ui.menu"          = { fg = "#b4b4c8", bg = "#282832" }
"ui.menu.selected" = { fg = "#ffffff", bg = "#50508c" }
"ui.menu.scroll"   = { fg = "cyan", bg = "#282832" }

# ── Hover / signature-help popup ────────────────────────────────────────────────
"ui.popup" = { fg = "#d0d0d0", bg = "#282832" }
"ui.popup.scroll" = { fg = "cyan", bg = "#282832" }

# ── Bottom drawer (location lists, etc.) ────────────────────────────────────────
"ui.drawer" = { fg = "#b4b4c8", bg = "#282832" }

# ── Statusline ────────────────────────────────────────────────────────────────
"ui.statusline"           = { fg = "statusline_fg", bg = "statusline" }
"ui.statusline.normal"    = { fg = "statusline_fg", bg = "statusline" }
"ui.statusline.insert"    = { fg = "statusline_fg", bg = "statusline_insert" }
"ui.statusline.extend"    = { fg = "statusline_fg", bg = "statusline_extend" }
"ui.statusline.search"    = { fg = "statusline_fg", bg = "statusline_search" }
"ui.statusline.command"   = { fg = "statusline_fg", bg = "statusline_command" }
"ui.statusline.select"    = { fg = "statusline_fg", bg = "statusline_select" }
"ui.statusline.separator" = { fg = "dark_gray" }

[palette]
fg           = "#d0d0d0"
bg           = "#1a1a1a"
black        = "#000000"
white        = "#ffffff"
red          = "#e05050"
dark_gray    = "#808080"
mid_gray     = "#8c8ca0"
cursor_line  = "#3a3a3a"
selection    = "#444478"
statusline   = "#ffffff"
statusline_fg = "#000000"
statusline_insert  = "#8fdcdc"
statusline_extend  = "#ecdf8f"
statusline_search  = "#e8a8e8"
statusline_command = "#a8dca8"
statusline_select  = "#a8c0f0"
cyan         = "#00cdcd"
yellow       = "#cdcd00"
magenta      = "#cd00cd"
green        = "#00cd00"
blue         = "#0000ee"
syn_comment  = "#6a7080"
syn_string   = "#7ab87a"
syn_escape   = "#d09060"
syn_number   = "#d09060"
syn_const    = "#c07ad8"
syn_keyword  = "#5bc0eb"
syn_function = "#e8c83a"
syn_type     = "#5bc4b4"
syn_param    = "#c4b4a0"
