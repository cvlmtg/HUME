# Same as upstream, plus HUME's own additions and deviations marked inline
# below (see the "HUME additions" marker).

"ui.background" = {bg="nord6"}
"ui.text" = "nord0"
"ui.selection" = {bg="nord7", fg="nord6"}
"ui.cursorline" = {bg="nord4"}
"ui.statusline" = {bg="nord4", fg="nord0"}
"ui.statusline.inactive" = {bg="nord5", fg="nord0"}
"ui.cursor.match" = {bg="nord8"}
"ui.cursor" = {bg="nord10", fg="nord6"}
"ui.cursorline.primary" = {bg="nord5"}
"ui.linenr" = {fg="nord7"}
"ui.linenr.selected" = {fg="nord0", bg="nord5"}
"ui.menu" = {bg="nord4",fg="nord0"}
"ui.menu.selected" = {bg="nord5"}
"ui.popup" = {bg="nord4"}
"ui.popup.info" = {bg="nord4",fg="nord0"}
"ui.help" = {bg="nord4",fg="nord0"}
"ui.window" = {bg="nord4"}


"ui.statusline.normal" = { fg = "nord0", bg = "nord8" }
"ui.statusline.insert" = { fg = "nord0", bg = "nord13" }
"ui.statusline.select" = { fg = "nord0", bg = "nord15" }

# Virtual/invisible text
"ui.virtual" = "nord8"
"ui.virtual.ruler" = {bg="nord4"}
"ui.virtual.inlay-hint" = { fg = "nord3", modifiers = ["italic"] }
"ui.virtual.jump-label" = { fg = "nord11", modifiers = ["bold"] }



# `fg` added to each (upstream sets only `underline`): a plugin-defined
# sub-scope like "diagnostic.warning.<marker>" falls back to this scope by
# dot-notation and needs a real color, not just an underline, to resolve to.
"diagnostic.error" = { fg = "nord11", underline = { color = "nord11", style = "curl" } }
"diagnostic.warning" = { fg = "nord13", underline = { color = "nord13", style = "curl" } }
"diagnostic.info" = { fg = "nord13", underline = { color = "nord13", style = "curl" } }
"diagnostic.hint" = { fg = "nord13", underline = { color = "nord13", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

"constant.numeric" = {fg="nord15"}
"constant.builtin" = {fg="nord15"}

"keyword" = {fg="nord2"}
"keyword.control" = {fg="nord2"}
"keyword.function" = {fg="nord2"}

"function" = {fg="nord3"}
"function.macro" = {fg="nord10", modifiers=["bold"]}
"function.method" = {fg="nord0"}
"function.builtin" = {fg="nord10"}

"variable.builtin" = {fg="nord3"}
"variable.other" = {fg="nord3"}
"variable" = {fg="nord0"}

"string" = "nord14"
"comment" = "nord7"
"namespace" = {fg="nord10"}
"attribute" = {fg="nord10"}
"type" = {fg="nord10"}

"markup.heading" = {fg="nord0", modifiers=["bold"]}
"markup.raw" = {fg="nord10"}
"markup.link.url" = {fg="nord3"}
"markup.link.text" = {fg="nord12"}
"markup.quote" = {fg="nord3", modifiers=["italic"]}

"diff.plus" = {fg = "nord14"}
"diff.delta" = {fg = "nord13"}
"diff.minus" = {fg = "nord11"}

# ── HUME additions ─────────────────────────────────────────────────────────
# Scopes below have no value upstream. Values draw only on the palette
# below, chosen to sit naturally alongside it.

# Focused-pane seam accent (`ui.window` above is the unfocused seam).
"ui.window.focused" = { fg = "nord10" }

# Every visible search match, distinct from the bracket-match
# `ui.cursor.match` above.
"ui.cursor.match.search" = { fg = "nord0", bg = "nord12" }

# The `<200b>` stand-in for a character the terminal must not be shown. Not
# muted like the rest of `ui.virtual`: a bidi override hiding in source is
# what this has to catch the eye for.
"ui.virtual.invisible" = { fg = "nord0", bg = "nord11" }

# Mode rows. The whole statusline tints with the mode's style, so each
# mode needs its own `bg` (Extend reads Helix's `ui.statusline.select`).
"ui.statusline.search" = { fg = "nord0", bg = "nord12", modifiers = ["bold"] }
"ui.statusline.command" = { fg = "nord0", bg = "nord14", modifiers = ["bold"] }
"ui.statusline.sift" = { fg = "nord0", bg = "nord7", modifiers = ["bold"] }
"ui.statusline.separator" = { fg = "nord3" }

# Tab bar, a HUME-only surface distinct from Helix's own `ui.bufferline*`.
"ui.tabline" = { fg = "nord3", bg = "nord4" }
"ui.tabline.active" = { fg = "nord0", bg = "nord8", modifiers = ["bold"] }

"ui.popup.scroll" = { fg = "nord3", bg = "nord4" }
"ui.menu.scroll" = { fg = "nord3", bg = "nord4" }
"ui.drawer" = { fg = "nord0", bg = "nord5" }

# Gutter diagnostic signs.
"error" = { fg = "nord11" }
"warning" = { fg = "nord13" }
"info" = { fg = "nord13" }
"hint" = { fg = "nord13" }

# End-of-line diagnostic summary. Its own scope so this virtual text carries
# no `underlined` modifier from the `diagnostic.*` squiggle above; muted
# against that squiggle so the line's own code stays the brighter thing.
"error.diagnostic.inline" = { fg = "error_inline" }
"warning.diagnostic.inline" = { fg = "warning_inline" }
"info.diagnostic.inline" = { fg = "info_inline" }
"hint.diagnostic.inline" = { fg = "hint_inline" }

# :messages severity badge/body
"diagnostic.error.message" = { fg = "nord0", bg = "nord11" }
"diagnostic.warning.message" = { fg = "nord0", bg = "nord13" }
"diagnostic.info.message" = { fg = "nord0", bg = "nord13" }
"diagnostic.hint.message" = { fg = "nord0", bg = "nord13" }
"diagnostic.error.message-text" = { fg = "nord11" }
"diagnostic.warning.message-text" = { fg = "nord13" }
"diagnostic.info.message-text" = { fg = "nord13" }
"diagnostic.hint.message-text" = { fg = "nord13" }

# Whole-line diff tint (see the manual's Themes section for the details).
"diff.plus.line" = { bg = "diff_plus_bg" }
"diff.minus.line" = { fg = "nord0", bg = "diff_minus_bg" }
"diff.delta.line" = { bg = "diff_delta_bg" }

# Word-level segments mark the exact changed span inside a
# `diff.plus.line`/`diff.minus.line`-tinted line.
"diff.plus.word" = { fg = "nord0", bg = "diff_plus_word_bg", modifiers = ["bold"] }
"diff.minus.word" = { fg = "nord0", bg = "diff_minus_word_bg", modifiers = ["bold", "crossed_out"] }

# Markdown scopes upstream leaves unset.
"markup.heading.marker" = { fg = "nord3" }
"markup.link" = { fg = "nord10", modifiers = ["underlined"] }

[palette]
nord0 = "#2E3440"
nord1 = "#3B4252"
nord2 = "#434C5E"
nord3 = "#4C566A"
nord4 = "#D8DEE9"
nord5 = "#E5E9F0"
nord6 = "#ECEFF4"
nord7 = "#8FBCBB"
nord8 = "#88C0D0"
nord9 = "#81A1C1"
nord10 = "#5E81AC"
nord11 = "#BF616A"
nord12 = "#D08770"
nord13 = "#EBCB8B"
nord14 = "#A3BE8C"
nord15 = "#B48EAD"

# HUME additions — inline-diagnostic and diff tints, each a palette color
# blended toward `nord6`.
error_inline = "#cc8c93"
warning_inline = "#ebd6aa"
info_inline = "#ebd6aa"
hint_inline = "#ebd6aa"
diff_plus_bg = "#dfe6e1"
diff_plus_word_bg = "#d2ddcf"
diff_minus_bg = "#e4d5db"
diff_minus_word_bg = "#dcbcc2"
diff_delta_bg = "#d8e0ea"
