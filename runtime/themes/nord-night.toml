# Nord Night — ported from Helix's runtime/themes/nord-night.toml.
# Nord Night
#
# Based on the Nord theme, with minor modifications.
# The Background and the Primary Text color have been slightly darkened.
# The Aurora color palette has been used more generously.
#
# Source: https://github.com/helix-editor/helix/blob/ba40e547426b0f9896c8bdc699a4ab11f2b37dbc/runtime/themes/nord-night.toml
# License: licenses/nord.license
#
# This Source Code Form is subject to the terms of the Mozilla Public
# License, v. 2.0. If a copy of the MPL was not distributed with this
# file, You can obtain one at https://mozilla.org/MPL/2.0/.
#
# Same as upstream, plus HUME's own additions and deviations marked inline
# below (see the "HUME additions" marker).

inherits = 'nord'

'constant' = 'nord13'
'constant.builtin.boolean' = 'nord13'
'constant.numeric' = 'nord13'

'keyword.control' = 'nord11'
'keyword.control.conditional' = 'nord11'
'keyword.control.exception' = 'nord11'
'keyword.control.repeat' = 'nord11'
'keyword.control.return' = 'nord11'

'variable.parameter' = 'nord15'

[palette]
nord0 = '#252933'
nord4 = '#C0C5CF'

# HUME additions — inline-diagnostic and diff tints, each a palette color
# blended toward `nord0`.
error_inline = "#915059"
warning_inline = "#b09a71"
info_inline = "#6a93a1"
hint_inline = "#4d6788"
diff_plus_bg = "#3c4443"
diff_plus_word_bg = "#525f53"
diff_minus_bg = "#41333d"
diff_minus_word_bg = "#5c3d47"
diff_delta_bg = "#323a47"
