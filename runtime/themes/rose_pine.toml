# "keyword.function" = ""
# "keyword.storage" = ""
# "keyword.storage.type" = ""
# "keyword.storage.modifier" = ""

"operator" = "subtle"

"function" = "rose"         # maybe pine
"function.builtin" = { fg = "rose", modifiers = ["bold"] }
# "function.method" = ""
# "function.macro" = ""
# "function.special" = ""

"tag" = "foam"

"namespace" = "text"

"markup.heading.marker" = "muted"
"markup.heading" = { fg = "iris", modifiers = ["bold"] }
"markup.heading.1" = { fg = "iris", modifiers = ["bold"] }
"markup.heading.2" = { fg = "foam", modifiers = ["bold"] }
"markup.heading.3" = { fg = "rose", modifiers = ["bold"] }
"markup.heading.4" = { fg = "gold", modifiers = ["bold"] }
"markup.heading.5" = { fg = "pine", modifiers = ["bold"] }
"markup.heading.6" = { fg = "foam", modifiers = ["bold"] }
# "markup.heading.completion" = ""
# "markup.heading.hover" = ""
"markup.list" = "muted"
# "markup.list.unnumbered" = ""
# "markup.list.numbered" = ""
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link" = "iris"
"markup.link.url" = { fg = "iris", underline = { color = "iris", style = "line" } }
"markup.link.label" = "subtle"
"markup.link.text" = "foam"
"markup.quote" = "subtle"
"markup.raw" = "subtle"
"markup.raw.inline" = "gold"
# "markup.raw.inline.completion" = {}
# "markup.raw.inline.hover" = {}
"markup.raw.block" = "gold"
# "markup.normal" = ""
# "markup.normal.completion" = ""
# "markup.normal.hover" = ""

"diff" = "overlay"
"diff.plus" = "foam"
"diff.minus" = "love"
"diff.delta" = "highlight_high"
# "diff.delta.moved" = ""

# ── HUME additions ─────────────────────────────────────────────────────────
# Scopes below have no value upstream. Values draw only on the palette
# below, chosen to sit naturally alongside it.

# Focused-pane seam accent (`ui.window` above is the unfocused seam).
"ui.window.focused" = { fg = "rose" }

# Every visible search match, distinct from the bracket-match
# `ui.cursor.match` above.
"ui.cursor.match.search" = { fg = "base", bg = "gold" }

# Base virtual text (tilde filler, EOF marker).
"ui.virtual" = { fg = "muted" }

# The `<200b>` stand-in for a character the terminal must not be shown. Not
# muted like the rest of `ui.virtual`: a bidi override hiding in source is
# what this has to catch the eye for.
"ui.virtual.invisible" = { fg = "base", bg = "love" }

# Mode rows. The whole statusline tints with the mode's style, so each
# mode needs its own `bg` (Extend reads Helix's `ui.statusline.select`).
"ui.statusline.search" = { fg = "gold", bg = "gold_10", modifiers = ["bold"] }
"ui.statusline.command" = { fg = "love", bg = "love_10", modifiers = ["bold"] }
"ui.statusline.sift" = { fg = "text", bg = "highlight_high", modifiers = ["bold"] }
"ui.statusline.separator" = { fg = "muted" }

# Tab bar, a HUME-only surface distinct from Helix's own `ui.bufferline*`.
"ui.tabline" = { fg = "muted", bg = "surface" }
"ui.tabline.active" = { fg = "text", bg = "overlay", modifiers = ["bold"] }

"ui.popup.scroll" = { fg = "muted", bg = "highlight_med" }
"ui.drawer" = { fg = "text", bg = "surface" }

# End-of-line diagnostic summary. Its own scope so this virtual text carries
# no `underlined` modifier from the `diagnostic.*` squiggle above; muted
# against that squiggle so the line's own code stays the brighter thing.
"error.diagnostic.inline" = { fg = "error_inline" }
"warning.diagnostic.inline" = { fg = "warning_inline" }
"info.diagnostic.inline" = { fg = "info_inline" }
"hint.diagnostic.inline" = { fg = "hint_inline" }

# :messages severity badge/body
"diagnostic.error.message" = { fg = "base", bg = "love" }
"diagnostic.warning.message" = { fg = "base", bg = "gold" }
"diagnostic.info.message" = { fg = "base", bg = "foam" }
"diagnostic.hint.message" = { fg = "base", bg = "iris" }
"diagnostic.error.message-text" = { fg = "love" }
"diagnostic.warning.message-text" = { fg = "gold" }
"diagnostic.info.message-text" = { fg = "foam" }
"diagnostic.hint.message-text" = { fg = "iris" }

# Whole-line diff tint (see the manual's Themes section for the details).
"diff.plus.line" = { bg = "diff_plus_bg" }
"diff.minus.line" = { fg = "text", bg = "diff_minus_bg" }
"diff.delta.line" = { bg = "diff_delta_bg" }

# Word-level segments mark the exact changed span inside a
# `diff.plus.line`/`diff.minus.line`-tinted line.
"diff.plus.word" = { fg = "text", bg = "diff_plus_word_bg", modifiers = ["bold"] }
"diff.minus.word" = { fg = "text", bg = "diff_minus_word_bg", modifiers = ["bold", "crossed_out"] }

[palette]
base = "#191724"
surface = "#1f1d2e"
overlay = "#26233a"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
love_10 = "#311f30"
gold = "#f6c177"
gold_10 = "#30282c"
rose = "#ebbcba"
rose_10 = "#2f2834"
pine = "#31748f"
pine_10 = "#1a2030"
foam = "#9ccfd8"
foam_10 = "#252937"
iris = "#c4a7e7"
iris_10 = "#2b2539"
highlight_low = "#21202e"
highlight_med = "#403d52"
highlight_high = "#524f67"

# HUME additions — inline-diagnostic and diff tints, each a palette color
# blended toward `base`.
error_inline = "#ac5571"
warning_inline = "#b48e5e"
info_inline = "#7598a2"
hint_inline = "#917cac"
diff_plus_bg = "#313844"
diff_plus_word_bg = "#485965"
diff_minus_bg = "#3f2738"
diff_minus_word_bg = "#65374c"
diff_delta_bg = "#362e39"
