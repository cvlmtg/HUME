"diagnostic" = { underline = { color = "subtle", style = "curl" } }
# `fg` added to each (upstream sets only `underline`): a plugin-defined
# sub-scope like "diagnostic.warning.<marker>" falls back to this scope by
# dot-notation and needs a real color, not just an underline, to resolve to.
"diagnostic.hint" = { fg = "iris", underline = { color = "iris", style = "curl" } }
"diagnostic.info" = { fg = "foam", underline = { color = "foam", style = "curl" } }
"diagnostic.warning" = { fg = "gold", underline = { color = "gold", style = "curl" } }
"diagnostic.error" = { fg = "love", underline = { color = "love", style = "curl" } }
"special" = "rose"

"attribute" = "iris"

"type" = "foam"
# "type.builtin" = ""

"constructor" = "foam"

"constant" = "foam"
"constant.builtin" = "love"
"constant.builtin.boolean" = "rose"
"constant.character" = "gold"
"constant.character.escape" = "pine"
"constant.numeric" = "gold"
# "constant.numeric.integer" = ""
# "constant.numeric.float" = ""

"string" = "gold"
# "string.regexp" = ""
# "string.special" = ""
# "string.special.path" = ""
# "string.special.url" = ""
"string.special.symbol" = "iris"

"comment" = { fg = "muted", modifiers = ["italic"] }
# "comment.line" = ""
# "comment.block" = ""
# "comment.block.documentation" = ""

"variable" = "text"
"variable.builtin" = "love"
"variable.parameter" = "iris"
# "variable.other" = ""
"variable.other.member" = "foam"

"label" = "foam"

"punctuation" = "subtle"
# "punctuation.delimiter" = ""
# "punctuation.bracket" = ""
# "punctuation.special" = ""

"keyword" = "pine"
# "keyword.control" = ""
