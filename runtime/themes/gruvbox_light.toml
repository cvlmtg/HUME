# Gruvbox light — ported from Helix's runtime/themes/gruvbox_light.toml (MPL-2.0).
# Author : Rohan Jain <crodjer@pm.me>
# Author : Jakub Bartodziej <kubabartodziej@gmail.com>
# The theme uses the gruvbox light palette with standard contrast: github.com/morhetz/gruvbox
#
# Source: https://github.com/helix-editor/helix/blob/master/runtime/themes/gruvbox_light.toml
#
# Every scope gruvbox.toml defines is inherited and reskinned by the palette
# override below, so only the two scopes whose colours don't follow from it
# are restated. `gray`, `bg0_s` and the `*0` neutrals keep gruvbox dark's
# values, as upstream's light file also leaves them alone — so `gray0` below
# is upstream's palette shape only, referenced by no scope in either file.
#
# Upstream's `"ui.cursor.primary" = { modifiers = ["reversed"] }` is not
# ported; the parent's explicit `fg`/`bg` is kept instead.

inherits = "gruvbox"

"ui.cursor.match" = { bg = "bg2" }
"ui.cursorline" = { bg = "bg1" }

[palette]
bg0 = "#fbf1c7" # main background
bg1 = "#ebdbb2"
bg2 = "#d5c4a1"
bg3 = "#bdae93"
bg4 = "#a89984"

fg0 = "#282828" # main foreground
fg1 = "#3c3836"
fg2 = "#504945"
fg3 = "#665c54"
fg4 = "#7c6f64"

gray0 = "#7c6f64"

red1 = "#9d0006" # bright
green1 = "#79740e"
yellow1 = "#b57614"
blue1 = "#076678"
purple1 = "#8f3f71"
aqua1 = "#427b58"
orange1 = "#af3a03"

# HUME addition — diff row backgrounds authored fresh for this palette;
# gruvbox dark's diff backgrounds read as near-black against this bg0.
diff_plus_bg       = "#E3ECC0"
diff_plus_word_bg  = "#C7DA84"
diff_minus_bg      = "#F5D7CB"
diff_minus_word_bg = "#E8AC94"
diff_delta_bg      = "#EFE2B8"
