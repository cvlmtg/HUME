# Same as upstream, plus HUME's own additions and deviations marked inline
# below (see the "HUME additions" marker).

"annotation"                      = { fg = "foreground"                                                     }

"attribute"                       = { fg = "green",              modifiers = ["italic"]                     }

"comment"                         = { fg = "comment"                                                        }
"comment.block"                   = { fg = "comment"                                                        }
"comment.block.documentation"     = { fg = "comment"                                                        }
"comment.line"                    = { fg = "comment"                                                        }
"comment.line.documentation"      = { fg = "comment"                                                        }

"constant"                        = { fg = "purple"                                                         }
"constant.builtin"                = { fg = "purple"                                                         }
"constant.builtin.boolean"        = { fg = "purple"                                                         }
"constant.character"              = { fg = "cyan"                                                           }
"constant.character.escape"       = { fg = "pink"                                                           }
"constant.macro"                  = { fg = "purple"                                                         }
"constant.numeric"                = { fg = "purple"                                                         }
"constructor"                     = { fg = "purple"                                                         }

"definition"                      = { underline = { color = "cyan"                                        } }

"diagnostic"                      = { underline = { color = "orange",          style = "curl"             } }
# `fg` added to each (upstream sets only `underline`): a plugin-defined
# sub-scope like "diagnostic.warning.<marker>" falls back to this scope by
# dot-notation and needs a real color, not just an underline, to resolve to.
"diagnostic.hint"                 = { fg = "purple", underline = { color = "purple",          style = "curl"             } }
"diagnostic.warning"              = { fg = "yellow", underline = { color = "yellow",          style = "curl"             } }
"diagnostic.error"                = { fg = "red", underline = { color = "red",             style = "curl"             } }
"diagnostic.info"                 = { fg = "cyan", underline = { color = "cyan",            style = "curl"             } }
"diagnostic.unnecessary"          = { modifiers = ["dim"]                                                   }
"diagnostic.deprecated"           = { modifiers = ["crossed_out"]                                           }

"error"                           = { fg    = "red"                                                         }
"hint"                            = { fg    = "purple"                                                      }
"info"                            = { fg    = "cyan"                                                        }
"warning"                         = { fg    = "yellow"                                                      }

"diff.delta"                      = { fg    = "orange"                                                      }
"diff.minus"                      = { fg    = "red"                                                         }
"diff.plus"                       = { fg    = "green"                                                       }

# d
"function"                        = { fg = "green"                                                          }
"function.builtin"                = { fg = "green"                                                          }
"function.call"                   = { fg = "green"                                                          }
"function.macro"                  = { fg = "purple"                                                         }
"function.method"                 = { fg = "green"                                                          }

"keyword"                         = { fg = "pink"                                                           }
"keyword.control.conditional"     = { fg = "pink"                                                           }
"keyword.control.exception"       = { fg = "purple"                                                         }
"keyword.control.import"          = { fg = "pink"                                                           }
"keyword.control.repeat"          = { fg = "pink"                                                           }
"keyword.directive"               = { fg = "green"                                                          }
"keyword.function"                = { fg = "pink"                                                           }
"keyword.operator"                = { fg = "pink"                                                           }
"keyword.return"                  = { fg = "pink"                                                           }
"keyword.storage"                 = { fg = "pink"                                                           }
"keyword.storage.modifier"        = { fg = "pink"                                                           }
"keyword.storage.type"            = { fg = "cyan",               modifiers = ["italic"]                     }

"label"                           = { fg = "cyan"                                                           }

"markup.bold"                     = { fg    = "orange",          modifiers = ["bold"]                       }
"markup.heading"                  = { fg    = "purple",          modifiers = ["bold"]                       }
"markup.italic"                   = { fg    = "yellow",          modifiers = ["italic"]                     }
"markup.link.text"                = { fg    = "pink"                                                        }
"markup.link.url"                 = { fg    = "cyan"                                                        }
"markup.list"                     = { fg    = "cyan"                                                        }
"markup.quote"                    = { fg    = "yellow",          modifiers = ["italic"]                     }
"markup.raw"                      = { fg    = "foreground"                                                  }
"markup.strikethrough"            = {                            modifiers = ["crossed_out"]                }

"punctuation"                     = { fg = "foreground"                                                     }
"punctuation.bracket"             = { fg = "foreground"                                                     }
"punctuation.delimiter"           = { fg = "foreground"                                                     }
"punctuation.special"             = { fg = "pink"                                                           }

"special"                         = { fg = "pink"                                                           }

"string"                          = { fg = "yellow"                                                         }
"string.regexp"                   = { fg = "red"                                                            }
"string.special"                  = { fg = "orange"                                                         }
"string.symbol"                   = { fg = "yellow"                                                         }

"tag"                             = { fg = "pink"                                                           }
"tag.attribute"                   = { fg = "purple"                                                         }
"tag.delimiter"                   = { fg = "foreground"                                                     }

"type"                            = { fg = "cyan",               modifiers = ["italic"]                     }
"type.builtin"                    = { fg = "cyan"                                                           }
"type.enum.variant"               = { fg = "foreground",         modifiers = ["italic"]                     }

"ui.background"                   = { fg    = "foreground",      bg = "background"                          }
"ui.cursor"                       = { fg    = "background",      bg = "purple",        modifiers = ["dim"]  }
"ui.cursor.insert"                = { fg    = "background",      bg = "green",         modifiers = ["dim"]  }	
"ui.cursor.match"                 = { fg    = "foreground",      bg = "grey"                                }
"ui.cursor.normal"                = { fg    = "background",      bg = "purple",        modifiers = ["dim"]  }	
"ui.cursor.primary.insert"        = { fg    = "background",      bg = "green"                               }	
"ui.cursor.primary.normal"        = { fg    = "background",      bg = "purple"                              }	
"ui.cursor.primary.select"        = { fg    = "background",      bg = "cyan"                                }
"ui.cursor.select"                = { fg    = "background",      bg = "cyan",          modifiers = ["dim"]  }
"ui.cursorline.primary"           = {                            bg = "cursorline"                          }
"ui.debug"                        = { fg    = "red"                                                         }
"ui.help"                         = { fg    = "foreground",      bg = "black"                               }
"ui.highlight.frameline"          = { fg    = "background",      bg = "red"                                 }
"ui.linenr"                       = { fg    = "comment"                                                     }
"ui.linenr.selected"              = { fg    = "foreground"                                                  }
"ui.menu"                         = { fg    = "foreground",      bg = "current_line"                        }
"ui.menu.scroll"                  = { fg    = "foreground",      bg = "current_line"                        }
"ui.menu.selected"                = { fg    = "current_line",    bg = "purple",        modifiers = ["dim"]  }
"ui.popup"                        = { fg    = "foreground",      bg = "black"                               }
"ui.selection"                    = {                            bg = "selection"                           }
"ui.selection.primary"            = {                            bg = "current_line"                        }
"ui.statusline"                   = { fg    = "foreground",      bg = "darker"                              }
"ui.statusline.inactive"          = { fg    = "comment",         bg = "darker"                              }
"ui.statusline.insert"            = { fg    = "black",           bg = "green",         modifiers = ["bold"] }
"ui.statusline.normal"            = { fg    = "black",           bg = "purple",        modifiers = ["bold"] }
"ui.statusline.select"            = { fg    = "black",           bg = "cyan",          modifiers = ["bold"] }
"ui.text"                         = { fg    = "foreground"                                                  }
"ui.text.focus"                   = { fg    = "cyan"                                                        }
"ui.text.directory"               = { fg    = "cyan"                                                        }
"ui.virtual.indent-guide"         = { fg    = "indent"                                                      }
"ui.virtual.inlay-hint"           = { fg    = "cyan"                                                        }
"ui.virtual.inlay-hint.parameter" = { fg    = "cyan",            modifiers = ["italic", "dim"]              }
"ui.virtual.inlay-hint.type"      = { fg    = "cyan",            modifiers = ["italic", "dim"]              }
"ui.virtual.jump-label"           = { fg    = "pink",            modifiers = ["bold"]                       }
"ui.virtual.ruler"                = { bg    = "black"                                                       }
"ui.virtual.whitespace"           = { fg    = "whitespace"                                                  }
"ui.virtual.wrap"                 = { fg    = "current_line"                                                }
"ui.window"                       = { fg    = "foreground"                                                  }

"variable"                        = { fg = "foreground"                                                     }
"variable.builtin"                = { fg = "purple",             modifiers = ["italic"]                     }
"variable.other"                  = { fg = "foreground"                                                     }
"variable.other.member"           = { fg = "foreground"                                                     }
"variable.parameter"              = { fg = "orange",             modifiers = ["italic"]                     }

# ── HUME additions ─────────────────────────────────────────────────────────
# Scopes below have no value upstream. Values draw only on the palette
# below, chosen to sit naturally alongside it.

# Focused-pane seam accent (`ui.window` above is the unfocused seam).
"ui.window.focused" = { fg = "purple" }

# Every visible search match, distinct from the bracket-match
# `ui.cursor.match` above.
"ui.cursor.match.search" = { fg = "black", bg = "orange" }

# Base virtual text (tilde filler, EOF marker).
"ui.virtual" = { fg = "comment" }

# The `<200b>` stand-in for a character the terminal must not be shown. Not
# muted like the rest of `ui.virtual`: a bidi override hiding in source is
# what this has to catch the eye for.
"ui.virtual.invisible" = { fg = "black", bg = "red" }

# Mode rows. The whole statusline tints with the mode's style, so each
# mode needs its own `bg` (Extend reads Helix's `ui.statusline.select`).
"ui.statusline.search" = { fg = "black", bg = "orange", modifiers = ["bold"] }
"ui.statusline.command" = { fg = "black", bg = "pink", modifiers = ["bold"] }
"ui.statusline.sift" = { fg = "black", bg = "yellow", modifiers = ["bold"] }
"ui.statusline.separator" = { fg = "comment" }

# Tab bar, a HUME-only surface distinct from Helix's own `ui.bufferline*`.
"ui.tabline" = { fg = "comment", bg = "darker" }
"ui.tabline.active" = { fg = "foreground", bg = "current_line", modifiers = ["bold"] }

"ui.popup.scroll" = { fg = "comment", bg = "black" }
"ui.drawer" = { fg = "foreground", bg = "darker" }

# End-of-line diagnostic summary. Its own scope so this virtual text carries
# no `underlined` modifier from the `diagnostic.*` squiggle above; muted
# against that squiggle so the line's own code stays the brighter thing.
"error.diagnostic.inline" = { fg = "error_inline" }
"warning.diagnostic.inline" = { fg = "warning_inline" }
"info.diagnostic.inline" = { fg = "info_inline" }
"hint.diagnostic.inline" = { fg = "hint_inline" }

# :messages severity badge/body
"diagnostic.error.message" = { fg = "black", bg = "red" }
"diagnostic.warning.message" = { fg = "black", bg = "yellow" }
"diagnostic.info.message" = { fg = "black", bg = "cyan" }
"diagnostic.hint.message" = { fg = "black", bg = "purple" }
"diagnostic.error.message-text" = { fg = "red" }
"diagnostic.warning.message-text" = { fg = "yellow" }
"diagnostic.info.message-text" = { fg = "cyan" }
"diagnostic.hint.message-text" = { fg = "purple" }

# Whole-line diff tint (see the manual's Themes section for the details).
"diff.plus.line" = { bg = "diff_plus_bg" }
"diff.minus.line" = { fg = "foreground", bg = "diff_minus_bg" }
"diff.delta.line" = { bg = "diff_delta_bg" }

# Word-level segments mark the exact changed span inside a
# `diff.plus.line`/`diff.minus.line`-tinted line.
"diff.plus.word" = { fg = "foreground", bg = "diff_plus_word_bg", modifiers = ["bold"] }
"diff.minus.word" = { fg = "foreground", bg = "diff_minus_word_bg", modifiers = ["bold", "crossed_out"] }

# Markdown scopes upstream leaves unset.
"markup.heading.marker" = { fg = "comment" }
"markup.link" = { fg = "cyan", modifiers = ["underlined"] }

[palette]
background        = "#282A36"
black             = "#191A21"
comment           = "#6272A4"
current_line      = "#44475a"
cursorline        = "#2d303e"
cyan              = "#8be9fd"
darker            = "#222430"
foreground        = "#f8f8f2"
green             = "#50fa7b" 
grey              = "#666771"
indent            = "#56596a"
orange            = "#ffb86c" 
pink              = "#ff79c6"
purple            = "#BD93F9" 
red               = "#ff5555"
selection         = "#363848"
whitespace        = "#586693"
yellow            = "#f1fa8c" 

# HUME additions — inline-diagnostic and diff tints, each a palette color
# blended toward `background`.
error_inline = "#be484c"
warning_inline = "#b5bc72"
info_inline = "#6db0c1"
hint_inline = "#9074be"
diff_plus_bg = "#2f4f42"
diff_plus_word_bg = "#36754f"
diff_minus_bg = "#4f323c"
diff_minus_word_bg = "#753941"
diff_delta_bg = "#364552"
