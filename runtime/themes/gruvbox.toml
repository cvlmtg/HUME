# Gruvbox dark theme for HUME.
# Ported from the Helix gruvbox theme (MIT licensed, © Helix contributors).
#
# ── Cursor ────────────────────────────────────────────────────────────────────
"ui.cursor.primary" = { fg = "bg0", bg = "fg0" }
"ui.cursor"         = { fg = "bg0", bg = "fg3" }

# ── Selection / cursor-line ───────────────────────────────────────────────────
"ui.selection"  = { bg = "bg3" }
"ui.cursorline" = { bg = "bg1" }

# ── Base text / pane background ─────────────────────────────────────────────
"ui.background" = { bg = "bg0" }
"ui.text"       = { fg = "fg1" }
"ui.text.focus" = { fg = "fg0", bg = "bg3" }

# ── Virtual text ──────────────────────────────────────────────────────────────
"ui.virtual" = { fg = "bg3" }
"ui.virtual.inlay-hint" = { fg = "bg3" }

# ── Gutter ────────────────────────────────────────────────────────────────────
"ui.linenr"          = { fg = "bg4" }
"ui.linenr.selected" = { fg = "fg2" }

# ── Highlights ────────────────────────────────────────────────────────────────
"ui.cursor.match"     = { fg = "bright_yellow", bg = "bg1", modifiers = ["bold"] }
"ui.selection.search" = { fg = "bright_orange",  bg = "bg1" }

# ── Diagnostics ───────────────────────────────────────────────────────────────
"diagnostic.error"   = { fg = "bright_red",    modifiers = ["underlined"] }
"diagnostic.warning" = { fg = "bright_yellow", modifiers = ["underlined"] }
"diagnostic.info"    = { fg = "bright_blue",   modifiers = ["underlined"] }
"diagnostic.hint"    = { fg = "bright_green",  modifiers = ["underlined"] }

# :messages severity badge/body
"diagnostic.error.message"        = { fg = "bg0", bg = "bright_red" }
"diagnostic.warning.message"      = { fg = "bg0", bg = "bright_yellow" }
"diagnostic.info.message"         = { fg = "bg0", bg = "bright_blue" }
"diagnostic.hint.message"         = { fg = "bg0", bg = "bright_green" }
"diagnostic.error.message-text"   = { fg = "bright_red" }
"diagnostic.warning.message-text" = { fg = "bright_yellow" }
"diagnostic.info.message-text"    = { fg = "bright_blue" }
"diagnostic.hint.message-text"    = { fg = "bright_green" }

# ── Diff ──────────────────────────────────────────────────────────────────────
"diff.plus"         = { fg = "fg1", bg = "diff_plus_bg" }
"diff.minus"        = { fg = "fg1", bg = "diff_minus_bg" }
"diff.delta"        = { fg = "fg1", bg = "diff_delta_bg" }
"diff.plus.gutter"  = { fg = "bright_green" }
"diff.minus.gutter" = { fg = "bright_red" }
"diff.delta.gutter" = { fg = "bright_blue" }
# Word-level segments (`diff.*.word`) mark the exact changed span inside a
# `diff.plus`/`diff.minus`-tinted row
"diff.plus.word"    = { fg = "fg1", bg = "diff_plus_word_bg", modifiers = ["bold"] }
"diff.minus.word"   = { fg = "fg1", bg = "diff_minus_word_bg", modifiers = ["bold", "crossed_out"] }

# ── Whitespace ────────────────────────────────────────────────────────────────
"ui.whitespace" = { fg = "bg3" }

# ── Completion popup ──────────────────────────────────────────────────────────
"ui.menu"          = { fg = "fg2", bg = "bg2" }
"ui.menu.selected" = { fg = "fg0", bg = "bg3" }
"ui.menu.scroll"   = { fg = "yellow", bg = "bg2" }

# ── Hover / signature-help popup ────────────────────────────────────────────────
"ui.popup" = { fg = "fg2", bg = "bg2" }
"ui.popup.scroll" = { fg = "yellow", bg = "bg2" }

# ── Bottom drawer (location lists, etc.) ────────────────────────────────────────
"ui.drawer" = { fg = "fg2", bg = "bg2" }

# ── Statusline ────────────────────────────────────────────────────────────────
"ui.statusline"           = { fg = "bg0",  bg = "fg4" }
"ui.statusline.normal"    = { fg = "bg0",  bg = "fg4" }
"ui.statusline.insert"    = { fg = "bg0",  bg = "bright_blue" }
"ui.statusline.extend"    = { fg = "bg0",  bg = "bright_yellow" }
"ui.statusline.search"    = { fg = "bg0",  bg = "bright_purple" }
"ui.statusline.command"   = { fg = "bg0",  bg = "bright_green" }
"ui.statusline.select"    = { fg = "bg0",  bg = "bright_orange" }
"ui.statusline.separator" = { fg = "bg3" }

# ── Syntax ────────────────────────────────────────────────────────────────────
"comment"             = { fg = "gray", modifiers = ["italic"] }
"constant"            = "bright_purple"
"constant.numeric"    = "bright_purple"
"constant.character"  = "bright_purple"
"string"              = "bright_green"
"type"                = "bright_yellow"
"type.builtin"        = { fg = "bright_yellow", modifiers = ["bold"] }
"keyword"             = "red"
"keyword.control"     = "red"
"keyword.operator"    = "orange"
"keyword.function"    = { fg = "red", modifiers = ["bold"] }
"function"            = "bright_green"
"function.builtin"    = { fg = "bright_green", modifiers = ["bold"] }
"variable"            = "fg1"
"variable.builtin"    = { fg = "orange", modifiers = ["bold"] }
"operator"            = "orange"
"punctuation"         = "fg3"
"label"               = "bright_blue"

