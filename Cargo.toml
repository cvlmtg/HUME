[workspace]
members = ["hume-engine", "hume-editor", "hume-platform", "hume-scripting", "hume-editing", "hume-treesitter", "hume-lsp", "test-fixtures", "hume-ops", "hume-rope", "hume-grid", "hume-ui", "hume-decorations", "hume-grammar-build", "arch-lints"]
# Patched third-party crates (see vendor/README.md): dependencies, not members.
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.17.0"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.ropey]
opt-level = 3

[profile.dev.package.regex-cursor]
opt-level = 3

# Steel stack: Engine::new drops ~120 ms → ~107 ms in dev builds.
[profile.dev.package.steel-core]
opt-level = 3

[profile.dev.package.steel-parser]
opt-level = 3

[profile.dev.package.steel-gen]
opt-level = 3

[profile.dev.package.steel-quickscope]
opt-level = 3

[profile.dev.package.im-rc]
opt-level = 3

[profile.dev.package.lasso]
opt-level = 3

[profile.release]
lto = true
strip = true
codegen-units = 1

[workspace.dependencies]
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
unicode-segmentation = "1.13.2"
unicode-width = "0.2"
bitflags = "2"
rustc-hash = "2"
similar = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-traits = "0.2"
tree-sitter = "0.27"
# unsandboxed-kernel: macro expansion runs on a copy of the kernel image
# Engine::new already builds, instead of building a sandboxed second one.
# Plugins are full-trust, so the sandbox restricts nothing they can't do.
steel-core = { version = "0.8.3", features = ["custom-hash", "unsandboxed-kernel"] }

[patch.crates-io]
steel-core = { path = "vendor/steel-core" }
steel-parser = { path = "vendor/steel-parser" }
