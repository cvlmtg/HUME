[workspace]
members = ["hume-engine", "hume-editor", "hume-platform", "hume-scripting", "hume-editing", "hume-treesitter", "hume-lsp", "hume-test-fixtures"]
resolver = "2"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.ropey]
opt-level = 3

[profile.dev.package.regex-cursor]
opt-level = 3

# Steel stack: Engine::new drops ~120 ms → ~107 ms in dev builds.
[profile.dev.package.steel-core]
opt-level = 3

[profile.dev.package.steel-parser]
opt-level = 3

[profile.dev.package.steel-gen]
opt-level = 3

[profile.dev.package.steel-quickscope]
opt-level = 3

[profile.dev.package.im-rc]
opt-level = 3

[profile.dev.package.lasso]
opt-level = 3

[profile.release]
lto = true
strip = true
codegen-units = 1

[workspace.dependencies]
ropey = "1.6.1"
unicode-segmentation = "1.13.2"
unicode-width = "0.2"
ratatui = "0.30"
similar = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
tree-sitter = "0.26.8"
