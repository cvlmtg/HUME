[workspace]
members = ["hume-engine", "hume-editor", "hume-platform", "hume-scripting", "hume-editing"]
resolver = "2"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.ropey]
opt-level = 3

[profile.dev.package.regex-cursor]
opt-level = 3

[profile.release]
lto = true
strip = true
codegen-units = 1

[workspace.dependencies]
ropey = "1.6.1"
unicode-segmentation = "1.13.2"
unicode-width = "0.2"
ratatui = "0.30"
