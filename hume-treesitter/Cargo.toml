[package]
name = "hume-treesitter"
version.workspace = true
edition = "2024"

[dependencies]
hume-engine = { path = "../hume-engine" }
hume-editing = { path = "../hume-editing" }
hume-rope = { path = "../hume-rope" }
hume-platform = { path = "../hume-platform" }
globset = "0.4"
tree-sitter.workspace = true
tree-sitter-language = "0.1"
libloading = "0.9"
streaming-iterator = "0.1"
ropey.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
hume-platform = { path = "../hume-platform", features = ["test-util"] }
slotmap = "1"
tempfile = "3"
test-fixtures = { path = "../test-fixtures" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"

[features]
# Exposes test-only registry methods (register_identity, remove) to
# consumers' own test code — hume-editor's tests build LanguageRegistry
# fixtures via this crate, so #[cfg(test)] alone (crate-local) isn't enough.
test-util = []

[[bench]]
name = "indent"
harness = false
