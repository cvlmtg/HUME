[package]
name = "hume-treesitter"
version.workspace = true
edition = "2024"

[dependencies]
hume-engine = { path = "../hume-engine" }
hume-editing = { path = "../hume-editing" }
hume-rope = { path = "../hume-rope" }
hume-core = { path = "../hume-core" }
hume-platform = { path = "../hume-platform" }
globset = "0.4"
tree-sitter.workspace = true
tree-sitter-language = "0.1"
libloading = "0.9"
streaming-iterator = "0.1"
ropey.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
hume-core = { path = "../hume-core", features = ["test-util"] }
hume-treesitter = { path = ".", features = ["test-util"] }
hume-platform = { path = "../hume-platform", features = ["test-util"] }
slotmap = "1"
tempfile = "3"
test-fixtures = { path = "../test-fixtures" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"

[features]
# Exposes test-only registry, snapshot and syntax helpers to code that links
# against the lib rather than being compiled into it, where #[cfg(test)] is
# off: hume-editor's tests, and this crate's own benches through the
# dev-dependency on itself below.
test-util = []

[[bench]]
name = "indent"
harness = false
