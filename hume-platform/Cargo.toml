[package]
name = "hume-platform"
version = "0.1.0"
edition = "2024"

[dependencies]
termina = "0.3.3"
ratatui-termina = "0.1"
ratatui.workspace = true
ctrlc = { version = "3", features = ["termination"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["poll", "user", "fs", "signal"] }
