[package]
name = "hume-platform"
version.workspace = true
edition = "2024"

[dependencies]
hume-grid = { path = "../hume-grid" }
termina = "0.4.0"
gethostname = "1"
tempfile = "3"

[dev-dependencies]
insta = "1.47"

[features]
# Exposes test-only doubles/constants to consumer crates — same convention as
# hume-lsp's `test-util` (see its `src/lib.rs`).
test-util = []

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["poll", "user", "fs", "signal", "process"] }
# unix.rs uses only `consts::signal`, `flag::{register_conditional_shutdown,
# register_usize}`, and `low_level::pipe::register` — the default `channel`/
# `iterator` front-ends are dead code here.
signal-hook = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
