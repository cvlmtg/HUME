[package]
name = "hume-platform"
version = "0.1.0"
edition = "2024"

[dependencies]
hume-grid = { path = "../hume-grid" }
termina = "0.3.3"
tempfile = "3"

[features]
# Exposes test-only doubles/constants to consumer crates — same convention as
# hume-lsp's `test-util` (see its `src/lib.rs`).
test-util = []

[target.'cfg(unix)'.dependencies]
# `nix`'s only FIONREAD access is `ioctl_read_bad!`, which expands to an
# `unsafe fn` — forbidden by this project's no-`unsafe` rule. `rustix::io::
# ioctl_fionread` is a safe wrapper over the same ioctl, hence both crates.
nix = { version = "0.31", default-features = false, features = ["poll", "user", "fs", "signal", "process"] }
rustix = "1"
# unix.rs uses only `consts::signal`, `flag::{register_conditional_shutdown,
# register_usize}`, and `low_level::pipe::register` — the default `channel`/
# `iterator` front-ends are dead code here.
signal-hook = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
# ctrlc is Windows-only now — Unix termination goes through signal-hook
# directly (see unix.rs). Its `termination` feature (SIGTERM/SIGHUP) is
# dropped: that feature only does anything in ctrlc's own Unix code path,
# which is never compiled here.
ctrlc = { version = "3" }
