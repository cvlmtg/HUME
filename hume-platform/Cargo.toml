[package]
name = "hume-platform"
version = "0.1.0"
edition = "2024"

[dependencies]
termina = "0.3.3"
ratatui-termina = "0.1"
ratatui.workspace = true
ctrlc = { version = "3", features = ["termination"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["poll", "user", "fs", "signal"] }
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_Threading",
] }
