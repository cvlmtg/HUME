[package]
name = "hume-editor"
version = "0.12.0"
edition = "2024"

[[bin]]
name = "hume"
path = "src/main.rs"

[dependencies]
hume-engine = { path = "../hume-engine" }
hume-platform = { path = "../hume-platform" }
hume-scripting = { path = "../hume-scripting" }
hume-editing = { path = "../hume-editing" }
hume-rope = { path = "../hume-rope" }
hume-ops = { path = "../hume-ops" }
hume-treesitter = { path = "../hume-treesitter" }
hume-lsp = { path = "../hume-lsp" }
lsp-types = "0.97"
serde_json.workspace = true
globset = "0.4"
slotmap = "1"
rustc-hash.workspace = true
steel-core = { version = "0.8.2", features = ["custom-hash"] }
ropey.workspace = true
unicode-segmentation.workspace = true
hume-grid = { path = "../hume-grid" }
# `color`/`suggestions` (clap's other defaults) are dropped: our four-argument
# CLI (main.rs) doesn't need "did you mean" suggestions, and unstyled --help
# output is an acceptable trade for skipping `anstream`/`anstyle-parse`/etc.
clap = { version = "4.6.1", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
termina = "0.3.3"
regex-cursor = "0.1.5"
# Text-only clipboard: `default-features = false` drops `image-data`, which
# otherwise pulls in a JPEG/TIFF decoder and an ICC colour-management engine
# (`image`, `tiff`, `zune-jpeg`, `moxcms`, ...) that `clipboard.rs` never uses.
arboard = { version = "3", default-features = false }
nucleo-matcher = "0.3.1"

[dev-dependencies]
# Independent width oracle for UI-chrome tests: asserts against `unicode-width`
# directly rather than through `hume_rope::width`, the code under test.
unicode-width.workspace = true
pretty_assertions = "1.4.1"
proptest = "1.11.0"
insta = "1.47"
tempfile = "3"
# Reentrant lock for the test suite's process-global guards (HUME_RUNTIME,
# TMPDIR, cwd, ...) — see `editor/tests/mod.rs`'s `TestGlobals`.
parking_lot = "0.12"
tree-sitter.workspace = true
hume-scripting = { path = "../hume-scripting", features = ["test-util"] }
hume-treesitter = { path = "../hume-treesitter", features = ["test-util"] }
hume-lsp = { path = "../hume-lsp", features = ["test-util"] }
hume-platform = { path = "../hume-platform", features = ["test-util"] }
hume-ops = { path = "../hume-ops", features = ["test-util"] }
hume-test-fixtures = { path = "../hume-test-fixtures" }
