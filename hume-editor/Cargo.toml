[package]
name = "hume-editor"
version = "0.9.0"
edition = "2024"

[[bin]]
name = "hume"
path = "src/main.rs"

[dependencies]
hume-engine = { path = "../hume-engine" }
hume-platform = { path = "../hume-platform" }
hume-scripting = { path = "../hume-scripting" }
hume-editing = { path = "../hume-editing" }
hume-treesitter = { path = "../hume-treesitter" }
hume-lsp = { path = "../hume-lsp" }
lsp-types = "0.97"
serde_json.workspace = true
globset = "0.4"
slotmap = "1"
rustc-hash.workspace = true
steel-core = { version = "0.8.2", features = ["custom-hash"] }
ropey.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
ratatui.workspace = true
# Unused directly: ratatui's layout-cache feature needs critical-section's std
# backend registered (no_std by default, otherwise a link error on Windows).
# Registered here, in the binary crate, since the backend choice is forced on
# the whole dependency graph and is a final-binary decision.
critical-section.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
termina = "0.3.3"
regex-cursor = "0.1.5"
arboard = "3"
nucleo-matcher = "0.3.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.11.0"
insta = "1.47"
tempfile = "3"
tree-sitter.workspace = true
hume-scripting = { path = "../hume-scripting", features = ["test-util"] }
hume-treesitter = { path = "../hume-treesitter", features = ["test-util"] }
hume-lsp = { path = "../hume-lsp", features = ["test-util"] }
hume-test-fixtures = { path = "../hume-test-fixtures" }
