[package]
name = "hume-editor"
version = "0.9.0"
edition = "2024"

[[bin]]
name = "hume"
path = "src/main.rs"

[dependencies]
hume-engine = { path = "../hume-engine" }
hume-platform = { path = "../hume-platform" }
hume-scripting = { path = "../hume-scripting" }
hume-editing = { path = "../hume-editing" }
hume-treesitter = { path = "../hume-treesitter" }
hume-lsp = { path = "../hume-lsp" }
serde_json.workspace = true
globset = "0.4"
tree-sitter = "0.26.8"
slotmap = "1"
steel-core = "0.8.2"
ropey.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
ratatui.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29"
regex-cursor = "0.1.5"
arboard = "3"

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.11.0"
insta = "1.47"
tempfile = "3"
hume-scripting = { path = "../hume-scripting", features = ["test-util"] }
hume-treesitter = { path = "../hume-treesitter", features = ["test-util"] }
hume-lsp = { path = "../hume-lsp", features = ["test-util"] }
lsp-types = "0.97"
